[package]
name = "surf-ace-cli"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Thin local Linux client for the resident Surf Ace controller"

[dependencies]
chrono = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "surf_ace_cli"
path = "src/lib.rs"

[[bin]]
name = "surf-ace"
path = "src/main.rs"
