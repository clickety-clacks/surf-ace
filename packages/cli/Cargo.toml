[package]
name = "surf-ace-cli"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "General standalone native controller CLI for Surf Ace"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "surf_ace_cli"
path = "src/lib.rs"

[[bin]]
name = "surf-ace"
path = "src/main.rs"
