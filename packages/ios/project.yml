name: SurfAce
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "14.0"
    visionOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SurfAce:
    type: application
    platform: iOS
    sources:
      - path: SurfAce
        excludes:
          - Info.plist
          - SurfAceSpatialIcon.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.clicketyclacks.SurfAce
        PRODUCT_NAME: SurfAce
        CURRENT_PROJECT_VERSION: 17
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z7R59J7QV8
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SurfAce/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  SurfAceSpatial:
    type: application
    platform: visionOS
    sources:
      - path: SurfAce
        excludes:
          - Info.plist
          - SurfAceSpatialIcon.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.clicketyclacks.SurfAce.spatial
        PRODUCT_NAME: SurfAce
        CURRENT_PROJECT_VERSION: 17
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z7R59J7QV8
        ASSETCATALOG_COMPILER_APPICON_NAME: SurfAceSpatialAppIcon
        INFOPLIST_FILE: SurfAceSpatial/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "7"
  SurfAceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SurfAceTests
      - path: ../protocol/vectors/authority-conformance.json
        buildPhase: resources
    dependencies:
      - target: SurfAce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.clicketyclacks.SurfAceTests
        GENERATE_INFOPLIST_FILE: YES
