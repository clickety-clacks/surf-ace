name: Build standalone Surf Ace release

on:
  workflow_dispatch:
    inputs:
      product_commit:
        description: Full commit SHA selected for the product tag; it must resolve to this exact commit.
        required: true
        type: string
      run_smoke:
        description: Run isolated Linux and macOS client/state acceptance after reproducible build comparison.
        required: true
        type: boolean
        default: false
      run_linux_smoke_only:
        description: Run only the network-isolated Linux smoke; leave run_smoke and publish_release false.
        required: true
        type: boolean
        default: false
      publish_release:
        description: Publish only after both smoke receipts and protected environment approval.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: surf-ace-v0.2.10-rc2
  cancel-in-progress: false

env:
  NODE_VERSION: 24.3.0
  PNPM_VERSION: 10.15.1
  POSTGRES_VERSION: "16"
  PRODUCT_TAG: surf-ace-v0.2.10-rc2-r1
  PRODUCT_VERSION: 0.2.10-rc2
  RUST_VERSION: 1.89.0
  LINUX_RUST_TARGET: x86_64-unknown-linux-gnu
  MACOS_RUST_TARGET: aarch64-apple-darwin
  TOOLING_TAG: surf-ace-release-tooling-v0.2.10-rc2-r1

jobs:
  guard:
    runs-on: macos-15
    outputs:
      product_commit: ${{ steps.identity.outputs.product_commit }}
    steps:
      - name: Require exact manual tooling and immutable product tags
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_COMMIT_INPUT: ${{ inputs.product_commit }}
        run: |
          set -euo pipefail
          [[ "${PRODUCT_COMMIT_INPUT}" =~ ^[a-f0-9]{40}$ ]]
          peel_tag() {
            read -r object_type object_sha <<EOF
          $(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1" --jq '.object.type + " " + .object.sha')
          EOF
            while test "${object_type}" = tag; do
              read -r object_type object_sha <<EOF
          $(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.type + " " + .object.sha')
          EOF
            done
            test "${object_type}" = commit
            printf '%s\n' "${object_sha}"
          }
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REF_TYPE}" = tag
          test "${GITHUB_REF}" = "refs/tags/${TOOLING_TAG}"
          tooling_remote="$(peel_tag "${TOOLING_TAG}")"
          product_remote="$(peel_tag "${PRODUCT_TAG}")"
          test "${tooling_remote}" = "${GITHUB_SHA}"
          test "${product_remote}" = "${PRODUCT_COMMIT_INPUT}"
          printf 'product_commit=%s\n' "${product_remote}" >> "${GITHUB_OUTPUT}"

  build-linux:
    needs: guard
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
    strategy:
      fail-fast: false
      matrix:
        lane: [build-a, build-b]
    runs-on: ubuntu-24.04
    container:
      image: rust:1.89.0-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Install checksum-pinned Node and pnpm
        run: |
          set -euo pipefail
          curl -fsSLO https://nodejs.org/dist/v24.3.0/node-v24.3.0-linux-x64.tar.xz
          printf '%s  %s\n' a962afadaa8b94bae8bff87ddd6c11f7aae621032424ef05c0a4fe2537fa4de0 node-v24.3.0-linux-x64.tar.xz | sha256sum -c -
          tar -xJf node-v24.3.0-linux-x64.tar.xz -C /usr/local --strip-components=1
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(rustc --version | cut -d' ' -f2)" = "${RUST_VERSION}"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
      - name: Install frozen dependencies and run Linux product tests
        run: |
          set -euo pipefail
          guard() {
            git -C source diff --exit-code HEAD -- .
            git -C source diff --cached --exit-code HEAD -- .
          }
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
          guard
          pnpm --dir source --filter @surf-ace/protocol build
          guard
          pnpm --dir source --filter @surf-ace/allocator build
          guard
          pnpm --dir source --filter @surf-ace/controller build
          guard
          pnpm --dir source --filter @surf-ace/controller test
          guard
          pnpm --dir source --filter @surf-ace/protocol test
          guard
          cargo test --manifest-path source/packages/cli/Cargo.toml --locked
          guard
      - name: Build standalone Linux server, CLI and Electron assets
        env:
          SURF_ACE_RELEASE_COMPONENT: linux
        run: |
          set -euo pipefail
          node tooling/scripts/release/build-tightbeam-release.mjs \
            --source-dir source \
            --output-dir build/release/tightbeam \
            --source-tag "${PRODUCT_TAG}" \
            --source-commit "${PRODUCT_COMMIT}" \
            --version "${PRODUCT_VERSION}" \
            --target "${LINUX_RUST_TARGET}"
      - name: Retain deterministic Linux assets and standalone skill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-linux-${{ matrix.lane }}
          path: |
            build/release/tightbeam/surf-ace-server-linux-x86_64-v0.2.10-rc2.tar.gz
            build/release/tightbeam/surf-ace-cli-linux-x86_64-v0.2.10-rc2.tar.gz
            build/release/tightbeam/surf-ace-electron-linux-x86_64-v0.2.10-rc2.zip
            build/release/tightbeam/surf-ace-skill-v0.2.10-rc2.md
          if-no-files-found: error
          retention-days: 30
      - name: Remove job-owned checkout and build paths
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}/source" "${GITHUB_WORKSPACE}/tooling" "${GITHUB_WORKSPACE}/build"

  build-macos:
    needs: guard
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
      EVIDENCE_DIR: ${{ github.workspace }}/release-evidence/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      EVIDENCE_READBACK_DIR: ${{ github.workspace }}/release-evidence-readback/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      RESULT_BUNDLE: ${{ github.workspace }}/release-evidence/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}/native-tests.xcresult
      EVIDENCE_ARTIFACT: surf-ace-macos-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [build-a, build-b]
    runs-on: xcode-27
    steps:
      - name: Prepare run-isolated macOS evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_ref=%s\n' "$GITHUB_REF"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'lane=%s\n' '${{ matrix.lane }}'
            printf 'runner_name=%s\n' "${RUNNER_NAME:-unknown}"
            printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
            printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'product_tag=%s\n' "$PRODUCT_TAG"
            printf 'product_commit=%s\n' "$PRODUCT_COMMIT"
            printf 'tooling_tag=%s\n' "$TOOLING_TAG"
            printf 'tooling_commit=%s\n' "$GITHUB_SHA"
            printf 'started_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf '\n--- macOS ---\n'
            sw_vers
            uname -a
          } > "$EVIDENCE_DIR/run-identity.txt"

      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Pin Node and select Xcode 27.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install frozen dependencies and run macOS/iPadOS tests
        id: macos-tests
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.0.0.app
          test "$(xcodebuild -version | head -1)" = "Xcode 27.0"
          xcrun simctl list runtimes | grep -F 'iOS 27.0'
          xcrun simctl list devices available | grep -F 'iPad Pro 13-inch (M5)'
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
          guard() {
            git -C source diff --exit-code HEAD -- .
            git -C source diff --cached --exit-code HEAD -- .
          }
          guard
          pnpm --dir source --filter @surf-ace/protocol build
          pnpm --dir source --filter @surf-ace/allocator build
          pnpm --dir source --filter @surf-ace/controller build
          pnpm --dir source --filter @surf-ace/electron build
          guard
          pnpm --dir source --filter @surf-ace/controller test
          pnpm --dir source --filter @surf-ace/protocol test
          python3 -m venv "${RUNNER_TEMP}/surf-ace-test-python"
          "${RUNNER_TEMP}/surf-ace-test-python/bin/python3" -m pip install jsonschema==4.25.1
          export PATH="${RUNNER_TEMP}/surf-ace-test-python/bin:${PATH}"
          pnpm --dir source --filter @surf-ace/electron test
          guard
          command=(
            xcodebuild test \
            -project source/packages/ios/SurfAce.xcodeproj \
            -scheme SurfAce \
            -configuration Release \
            ENABLE_TESTABILITY=YES \
            -parallel-testing-enabled NO \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=27.0' \
            -resultBundlePath "$RESULT_BUNDLE"
          )
          printf '%q ' "${command[@]}" > "$EVIDENCE_DIR/xcodebuild-command.txt"
          printf '\n' >> "$EVIDENCE_DIR/xcodebuild-command.txt"
          set +e
          "${command[@]}" 2>&1 | tee "$EVIDENCE_DIR/xcodebuild.log"
          pipeline_status=( "${PIPESTATUS[@]}" )
          set -e
          xcodebuild_exit_code="${pipeline_status[0]}"
          tee_exit_code="${pipeline_status[1]}"
          printf '%s\n' "$xcodebuild_exit_code" > "$EVIDENCE_DIR/xcodebuild-exit-code.txt"
          printf '%s\n' "$tee_exit_code" > "$EVIDENCE_DIR/xcodebuild-tee-exit-code.txt"
          if [[ "$xcodebuild_exit_code" != 0 ]]; then
            exit "$xcodebuild_exit_code"
          fi
          if [[ "$tee_exit_code" != 0 ]]; then
            exit "$tee_exit_code"
          fi
          guard

      - name: Capture macOS native test evidence
        if: always()
        shell: bash
        env:
          MACOS_TEST_STEP_OUTCOME: ${{ steps.macos-tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf 'macos_test_step_outcome=%s\n' "${MACOS_TEST_STEP_OUTCOME:-not-run}" \
            > "$EVIDENCE_DIR/test-step-outcome.txt"

          capture_tool() {
            local output="$1"
            shift
            if "$@" > "$EVIDENCE_DIR/$output" 2>&1; then
              printf 'exit_code=0\n' > "$EVIDENCE_DIR/$output.status"
            else
              local exit_code=$?
              printf 'exit_code=%s\n' "$exit_code" > "$EVIDENCE_DIR/$output.status"
            fi
          }

          capture_tool developer-directory.txt xcode-select -p
          capture_tool xcode-version.txt xcodebuild -version
          capture_tool xcode-sdks.txt xcodebuild -showsdks
          capture_tool swift-version.txt swift --version
          capture_tool ios-simulator-sdk-version.txt xcrun --sdk iphonesimulator --show-sdk-version
          capture_tool simulator-runtimes.txt xcrun simctl list runtimes
          capture_tool simulator-devices.txt xcrun simctl list devices available

          if [[ -d source/.git ]]; then
            {
              printf 'expected_product_commit=%s\n' "$PRODUCT_COMMIT"
              printf 'source_commit='
              git -C source rev-parse HEAD || printf 'unavailable\n'
              printf 'source_tree='
              git -C source rev-parse 'HEAD^{tree}' || printf 'unavailable\n'
              printf 'source_status:\n'
              git -C source status --short --branch || true
            } > "$EVIDENCE_DIR/source-identity.txt" 2>&1
          else
            printf 'source_checkout=unavailable\nexpected_product_commit=%s\n' "$PRODUCT_COMMIT" \
              > "$EVIDENCE_DIR/source-identity.txt"
          fi

          if [[ -d tooling/.git ]]; then
            {
              printf 'expected_tooling_commit=%s\n' "$GITHUB_SHA"
              printf 'tooling_commit='
              git -C tooling rev-parse HEAD || printf 'unavailable\n'
              printf 'tooling_tree='
              git -C tooling rev-parse 'HEAD^{tree}' || printf 'unavailable\n'
              printf 'tooling_status:\n'
              git -C tooling status --short --branch || true
            } > "$EVIDENCE_DIR/tooling-identity.txt" 2>&1
          else
            printf 'tooling_checkout=unavailable\nexpected_tooling_commit=%s\n' "$GITHUB_SHA" \
              > "$EVIDENCE_DIR/tooling-identity.txt"
          fi

          if [[ -d "$RESULT_BUNDLE" ]]; then
            capture_tool xcresult-summary.json xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE"
            capture_tool attachment-export.log xcrun xcresulttool export attachments \
              --path "$RESULT_BUNDLE" --output-path "$EVIDENCE_DIR/attachments"
          else
            printf 'No .xcresult bundle was created.\n' > "$EVIDENCE_DIR/xcresult-unavailable.txt"
          fi

          printf 'finished_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > "$EVIDENCE_DIR/evidence-captured-at.txt"
          python3 - "$EVIDENCE_DIR" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          excluded = {"capture-manifest.json", "capture-readback.json"}

          def file_digest(path):
              digest = hashlib.sha256()
              size = 0
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      size += len(chunk)
                      digest.update(chunk)
              return size, digest.hexdigest()

          entries = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name not in excluded:
                  size, digest = file_digest(path)
                  entries.append({"path": path.relative_to(root).as_posix(), "size_bytes": size, "sha256": digest})
          manifest_path = root / "capture-manifest.json"
          manifest_path.write_text(json.dumps({"files": entries}, indent=2) + "\n", encoding="utf-8")
          errors = []
          total_bytes = 0
          for entry in entries:
              path = root / entry["path"]
              if not path.is_file():
                  errors.append(f"missing:{entry['path']}")
                  continue
              size, digest = file_digest(path)
              total_bytes += size
              if size != entry["size_bytes"] or digest != entry["sha256"]:
                  errors.append(f"mismatch:{entry['path']}")
          readback = {"status": "PASS" if not errors else "FAIL", "file_count": len(entries),
                      "verified_size_bytes": total_bytes,
                      "capture_manifest_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
                      "errors": errors}
          (root / "capture-readback.json").write_text(json.dumps(readback, indent=2) + "\n", encoding="utf-8")
          if errors:
              raise SystemExit("macOS release evidence manifest verification failed")
          PY

      - name: Retain macOS release evidence
        if: always()
        id: upload-macos-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Download retained macOS evidence for readback
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: ${{ env.EVIDENCE_READBACK_DIR }}
      - name: Verify retained macOS evidence readback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if python3 - "$EVIDENCE_READBACK_DIR" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest_path = root / "capture-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          errors = []
          for entry in manifest.get("files", []):
              path = root / entry["path"]
              if not path.is_file():
                  errors.append(f"missing:{entry['path']}")
                  continue
              digest = hashlib.sha256()
              size = 0
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      size += len(chunk)
                      digest.update(chunk)
              if size != entry["size_bytes"] or digest.hexdigest() != entry["sha256"]:
                  errors.append(f"mismatch:{entry['path']}")
          readback = json.loads((root / "capture-readback.json").read_text(encoding="utf-8"))
          if readback.get("status") != "PASS":
              errors.append("staging-readback-failed")
          if readback.get("capture_manifest_sha256") != hashlib.sha256(manifest_path.read_bytes()).hexdigest():
              errors.append("manifest-digest-mismatch")
          if errors:
              raise SystemExit(";".join(errors))
          print(len(manifest.get("files", [])))
          PY
          then
            printf 'PASS\n' > "$EVIDENCE_DIR/evidence-readback-status.txt"
            manifest_sha256="$(shasum -a 256 "$EVIDENCE_READBACK_DIR/capture-manifest.json" | awk '{print $1}')"
            {
              printf 'Verified the uploaded evidence after artifact download.\n'
              printf 'Capture manifest SHA-256: %s\n' "$manifest_sha256"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'FAIL\n' > "$EVIDENCE_DIR/evidence-readback-status.txt"
            printf 'The uploaded macOS evidence could not be verified after download.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build standalone macOS CLI and Electron assets
        env:
          SURF_ACE_RELEASE_COMPONENT: macos
        run: |
          set -euo pipefail
          node tooling/scripts/release/build-tightbeam-release.mjs \
            --source-dir source \
            --output-dir build/release/tightbeam \
            --source-tag "${PRODUCT_TAG}" \
            --source-commit "${PRODUCT_COMMIT}" \
            --version "${PRODUCT_VERSION}"
      - name: Retain deterministic macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-macos-${{ matrix.lane }}
          path: |
            build/release/tightbeam/surf-ace-cli-macos-arm64-v0.2.10-rc2.tar.gz
            build/release/tightbeam/surf-ace-electron-macos-arm64-v0.2.10-rc2.zip
          if-no-files-found: error
          retention-days: 30
      - name: Remove job-owned checkout and build paths
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}/source" "${GITHUB_WORKSPACE}/tooling" "${GITHUB_WORKSPACE}/build"

  retain-macos-job-logs:
    if: always()
    needs: [build-macos]
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    env:
      JOB_EVIDENCE_DIR: ${{ github.workspace }}/macos-job-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      JOB_LOG_ARTIFACT: surf-ace-macos-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Prepare run-isolated job log evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_EVIDENCE_DIR"
          mkdir -p "$JOB_EVIDENCE_DIR/job-logs"
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_ref=%s\n' "$GITHUB_REF"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'started_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$JOB_EVIDENCE_DIR/run-identity.txt"
      - name: Download completed macOS job logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100"
          if curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "$jobs_url" --output "$JOB_EVIDENCE_DIR/jobs.json"; then
            python3 - "$JOB_EVIDENCE_DIR/jobs.json" "$JOB_EVIDENCE_DIR/macos-jobs.tsv" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              for job in payload.get("jobs", []):
                  name = job.get("name", "")
                  if name.startswith("build-macos"):
                      fields = [job.get("id", ""), name, job.get("conclusion") or "", job.get("runner_name") or ""]
                      output.write("\t".join(str(field).replace("\t", " ").replace("\n", " ") for field in fields) + "\n")
          PY
          else
            printf '{"jobs":[]}\n' > "$JOB_EVIDENCE_DIR/jobs.json"
            : > "$JOB_EVIDENCE_DIR/macos-jobs.tsv"
          fi

          downloaded=0
          failed=0
          while IFS=$'\t' read -r job_id job_name conclusion runner_name; do
            [[ -n "$job_id" ]] || continue
            safe_name="$(printf '%s' "$job_name" | tr -cs 'A-Za-z0-9._-' '-')"
            log_path="$JOB_EVIDENCE_DIR/job-logs/${job_id}-${safe_name}.txt"
            log_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs"
            if curl --fail --silent --show-error --location --retry 2 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "$log_url" --output "$log_path"; then
              downloaded=$((downloaded + 1))
            else
              failed=$((failed + 1))
              rm -f "$log_path"
            fi
          done < "$JOB_EVIDENCE_DIR/macos-jobs.tsv"
          if [[ ! -s "$JOB_EVIDENCE_DIR/macos-jobs.tsv" ]]; then
            printf 'No completed macOS build job logs were available.\n' \
              > "$JOB_EVIDENCE_DIR/job-logs-unavailable.txt"
          fi
          {
            printf 'macos_job_logs_downloaded=%s\n' "$downloaded"
            printf 'macos_job_logs_failed=%s\n' "$failed"
          } > "$JOB_EVIDENCE_DIR/job-log-capture-status.txt"
      - name: Hash and verify macOS job logs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$JOB_EVIDENCE_DIR" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          excluded = {"job-log-manifest.json", "job-log-readback.json"}

          def file_digest(path):
              digest = hashlib.sha256()
              size = 0
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      size += len(chunk)
                      digest.update(chunk)
              return size, digest.hexdigest()

          entries = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name not in excluded:
                  size, digest = file_digest(path)
                  entries.append({"path": path.relative_to(root).as_posix(), "size_bytes": size, "sha256": digest})
          manifest_path = root / "job-log-manifest.json"
          manifest_path.write_text(json.dumps({"files": entries}, indent=2) + "\n", encoding="utf-8")
          errors = []
          total_bytes = 0
          for entry in entries:
              path = root / entry["path"]
              if not path.is_file():
                  errors.append(f"missing:{entry['path']}")
                  continue
              size, digest = file_digest(path)
              total_bytes += size
              if size != entry["size_bytes"] or digest != entry["sha256"]:
                  errors.append(f"mismatch:{entry['path']}")
          readback = {"status": "PASS" if not errors else "FAIL", "file_count": len(entries),
                      "verified_size_bytes": total_bytes,
                      "manifest_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(), "errors": errors}
          readback_path = root / "job-log-readback.json"
          readback_path.write_text(json.dumps(readback, indent=2) + "\n", encoding="utf-8")
          if errors:
              raise SystemExit("macOS job log manifest verification failed")
          PY
      - name: Retain macOS job logs and size/SHA manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.JOB_LOG_ARTIFACT }}
          path: ${{ env.JOB_EVIDENCE_DIR }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  compare:
    needs: [build-linux, build-macos]
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Download independent Linux and macOS lane assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-linux-build-a
          path: build/downloads/build-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-macos-build-a
          path: build/downloads/build-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-linux-build-b
          path: build/downloads/build-b
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-macos-build-b
          path: build/downloads/build-b
      - name: Separate lane bytes and compare six reproducible release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-a build-b
          for file in \
            surf-ace-server-linux-x86_64-v0.2.10-rc2.tar.gz \
            surf-ace-cli-linux-x86_64-v0.2.10-rc2.tar.gz \
            surf-ace-electron-linux-x86_64-v0.2.10-rc2.zip \
            surf-ace-cli-macos-arm64-v0.2.10-rc2.tar.gz \
            surf-ace-electron-macos-arm64-v0.2.10-rc2.zip \
            surf-ace-skill-v0.2.10-rc2.md; do
            test -s "build/downloads/build-a/${file}"
            test -s "build/downloads/build-b/${file}"
            cp "build/downloads/build-a/${file}" build-a/
            cp "build/downloads/build-b/${file}" build-b/
          done
          mkdir -p build-a/.receipts build-b/.receipts
          for file in \
            surf-ace-cli-linux-x86_64-v0.2.10-rc2.tar.gz \
            surf-ace-cli-macos-arm64-v0.2.10-rc2.tar.gz \
            surf-ace-electron-linux-x86_64-v0.2.10-rc2.zip \
            surf-ace-electron-macos-arm64-v0.2.10-rc2.zip \
            surf-ace-server-linux-x86_64-v0.2.10-rc2.tar.gz \
            surf-ace-skill-v0.2.10-rc2.md; do
            (cd build-a && shasum -a 256 "${file}") >> build-a/.receipts/SHA256SUMS
            (cd build-b && shasum -a 256 "${file}") >> build-b/.receipts/SHA256SUMS
          done
          node tooling/scripts/release/compare-release-builds.mjs \
            --build-a build-a \
            --build-b build-b \
            --files surf-ace-server-linux-x86_64-v0.2.10-rc2.tar.gz,surf-ace-cli-linux-x86_64-v0.2.10-rc2.tar.gz,surf-ace-electron-linux-x86_64-v0.2.10-rc2.zip,surf-ace-cli-macos-arm64-v0.2.10-rc2.tar.gz,surf-ace-electron-macos-arm64-v0.2.10-rc2.zip,surf-ace-skill-v0.2.10-rc2.md
      - name: Retain byte-comparison receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-byte-comparison
          path: build-a
          if-no-files-found: error

  assemble:
    needs: [compare, guard]
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Download compared build A assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-linux-build-a
          path: build/release/tightbeam
      - name: Download compared macOS build A assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-macos-build-a
          path: build/release/tightbeam
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assemble exact six-asset manifest plus SHA256SUMS
        env:
          SURF_ACE_RELEASE_COMPONENT: manifest
        run: |
          set -euo pipefail
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          node tooling/scripts/release/build-tightbeam-release.mjs \
            --source-dir source \
            --output-dir build/release/tightbeam \
            --source-tag "${PRODUCT_TAG}" \
            --source-commit "${PRODUCT_COMMIT}" \
            --version "${PRODUCT_VERSION}" \
            --target "${LINUX_RUST_TARGET}"
      - name: Retain assembled release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-release-candidate
          path: build/release/tightbeam
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  smoke-linux:
    if: ${{ inputs.run_smoke || inputs.run_linux_smoke_only }}
    needs: [assemble, guard]
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Download assembled release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-release-candidate
          path: build/release/tightbeam
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux smoke host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            iproute2 libpq-dev postgresql-16 postgresql-client-16 util-linux \
            tar unzip x11-utils xauth xvfb
          for tool in ip unshare runuser xvfb-run Xvfb xauth xdpyinfo pg_config tar unzip timeout; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              echo "linux_smoke_required_tool_missing:${tool}" >&2
              exit 127
            fi
          done
          pg_bin="$(pg_config --bindir)"
          for tool in initdb postgres pg_ctl psql pg_basebackup pg_dump pg_restore; do
            if [[ ! -x "${pg_bin}/${tool}" ]]; then
              echo "linux_smoke_required_postgres_tool_missing:${pg_bin}/${tool}" >&2
              exit 127
            fi
          done
      - name: Prepare the exact candidate product and state driver
        run: |
          set -euo pipefail
          test "$(pg_config --version | cut -d' ' -f2 | cut -d. -f1)" = "${POSTGRES_VERSION}"
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
          pnpm --dir tooling fetch --frozen-lockfile
          pnpm --dir tooling install --offline --frozen-lockfile
      - name: Run PostgreSQL-backed server, packaged CLI, and Linux client acceptance
        env:
          SURF_ACE_SMOKE_COMPONENT: linux
          SURF_ACE_TIGHTBEAM_STATE_DRIVER: ${{ github.workspace }}/tooling/scripts/release/tightbeam-state-smoke-fixture.ts
        run: |
          set -euo pipefail
          smoke_tmp="$(mktemp -d /tmp/sa.XXXXXX)"
          trap 'rm -rf "$smoke_tmp"' EXIT
          smoke_user="$(id -un)"
          smoke_node="$(command -v node)"
          timeout --signal=TERM --kill-after=10s 20m sudo -n unshare --net -- bash -c '
            set -euo pipefail
            smoke_user=$1
            smoke_tmp=$2
            smoke_node=$3
            smoke_path=$4
            state_driver=$5
            product_commit=$6
            tooling_commit=$7
            ip link set lo up
            ip link add veth0 type veth peer name veth1
            ip addr add 198.18.0.1/30 dev veth0
            ip addr add 169.254.77.1/16 dev veth0
            ip link set veth0 up
            ip link set veth1 up
            ip route add 224.0.0.0/4 dev veth0
            ip -br addr >&2
            ip route >&2
            test -z "$(ip route show default)"
            exec runuser -u "$smoke_user" -- env \
              PATH="$smoke_path" TMPDIR="$smoke_tmp" \
              PRODUCT_COMMIT="$product_commit" \
              SURF_ACE_SMOKE_COMPONENT=linux \
              SURF_ACE_TIGHTBEAM_STATE_DRIVER="$state_driver" \
              xvfb-run -a "$smoke_node" tooling/scripts/release/smoke-tightbeam-release.mjs \
                --source-dir source \
                --source-commit "$product_commit" \
                --tooling-commit "$tooling_commit" \
                --candidate-commit "$product_commit" \
                --manifest build/release/tightbeam/surf-ace-v0.2.10-rc2-manifest.json
          ' bash "$smoke_user" "$smoke_tmp" "$smoke_node" "$PATH" \
            "$SURF_ACE_TIGHTBEAM_STATE_DRIVER" "$PRODUCT_COMMIT" "$GITHUB_SHA" \
            > linux-smoke.json 2> linux-smoke-stderr.log || {
              smoke_status=$?
              echo "Linux acceptance smoke failed with exit ${smoke_status}; diagnostic details follow." >&2
              if [[ "${smoke_status}" -eq 124 ]]; then
                echo "linux_smoke_packaged_acceptance_timeout_20m" >&2
              fi
              cat linux-smoke-stderr.log >&2
              if [[ -s linux-smoke.json ]]; then
                cat linux-smoke.json >&2
              fi
              mkdir -p linux-smoke-failure
              find "$smoke_tmp" -type f \( -name 'fresh-install-state.json' -o -name 'fresh-install-state.json.capture.png' \
                -o -name 'client-flight-recorder.log' \
                -o -name 'raw-cli-progress.ndjson' -o -name 'raw-cli-evidence.ndjson' \
                -o -name 'annotation-journal-progress.ndjson' \
                -o -name 'fresh-install.client-flight-recorder.log' -o -name 'fresh-install.second-client-flight-recorder.log' \
                -o -name 'fresh-install-registry.client-flight-recorder.log' -o -name 'primary.log' -o -name 'witness.log' \) \
                -exec cp {} linux-smoke-failure/ \;
              exit "${smoke_status}"
            }
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel tightbeam-linux \
            --manifest build/release/tightbeam/surf-ace-v0.2.10-rc2-manifest.json \
            --files build/release/tightbeam/surf-ace-server-linux-x86_64-v0.2.10-rc2.tar.gz,build/release/tightbeam/surf-ace-cli-linux-x86_64-v0.2.10-rc2.tar.gz,build/release/tightbeam/surf-ace-electron-linux-x86_64-v0.2.10-rc2.zip,build/release/tightbeam/surf-ace-cli-macos-arm64-v0.2.10-rc2.tar.gz,build/release/tightbeam/surf-ace-electron-macos-arm64-v0.2.10-rc2.zip,build/release/tightbeam/surf-ace-skill-v0.2.10-rc2.md \
            --output linux-smoke-receipt.json
      - name: Retain Linux smoke result and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-linux-smoke
          path: |
            linux-smoke.json
            linux-smoke-stderr.log
            linux-smoke-receipt.json
            linux-smoke-failure/
          if-no-files-found: error

  smoke-macos:
    if: ${{ inputs.run_smoke }}
    needs: [assemble, guard]
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
    runs-on: xcode-27
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Download assembled release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-release-candidate
          path: build/release/tightbeam
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install packaged Electron inspection dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
      - name: Select and verify Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.0.0.app
          test "$(xcodebuild -version | head -1)" = "Xcode 27.0"
      - name: Run the matching macOS candidate client and CLI smoke
        env:
          SURF_ACE_SMOKE_COMPONENT: macos
          SURF_ACE_SMOKE_FAILURE_OUTPUT: ${{ github.workspace }}/macos-smoke-failure.json
        run: |
          set -euo pipefail
          node tooling/scripts/release/smoke-tightbeam-release.mjs \
            --source-dir source \
            --source-commit "${PRODUCT_COMMIT}" \
            --tooling-commit "${GITHUB_SHA}" \
            --candidate-commit "${PRODUCT_COMMIT}" \
            --manifest build/release/tightbeam/surf-ace-v0.2.10-rc2-manifest.json \
            > macos-smoke.json
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel tightbeam-macos \
            --manifest build/release/tightbeam/surf-ace-v0.2.10-rc2-manifest.json \
            --files build/release/tightbeam/surf-ace-server-linux-x86_64-v0.2.10-rc2.tar.gz,build/release/tightbeam/surf-ace-cli-linux-x86_64-v0.2.10-rc2.tar.gz,build/release/tightbeam/surf-ace-electron-linux-x86_64-v0.2.10-rc2.zip,build/release/tightbeam/surf-ace-cli-macos-arm64-v0.2.10-rc2.tar.gz,build/release/tightbeam/surf-ace-electron-macos-arm64-v0.2.10-rc2.zip,build/release/tightbeam/surf-ace-skill-v0.2.10-rc2.md \
            --output macos-smoke-receipt.json
      - name: Retain macOS smoke result and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-macos-smoke
          path: |
            macos-smoke.json
            macos-smoke-receipt.json
            macos-smoke-failure.json
          if-no-files-found: warn

  publish:
    if: ${{ inputs.publish_release && inputs.run_smoke }}
    needs: [assemble, smoke-linux, smoke-macos]
    environment: tightbeam-release
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Download unchanged smoke-approved assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-release-candidate
          path: release
      - name: Download both smoke receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tightbeam-*-smoke
          merge-multiple: true
          path: release/.receipts
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify receipts bind the same exact six assets and manifest
        run: |
          set -euo pipefail
          FILES="release/surf-ace-server-linux-x86_64-v0.2.10-rc2.tar.gz,release/surf-ace-cli-linux-x86_64-v0.2.10-rc2.tar.gz,release/surf-ace-electron-linux-x86_64-v0.2.10-rc2.zip,release/surf-ace-cli-macos-arm64-v0.2.10-rc2.tar.gz,release/surf-ace-electron-macos-arm64-v0.2.10-rc2.zip,release/surf-ace-skill-v0.2.10-rc2.md"
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel tightbeam-linux \
            --manifest release/surf-ace-v0.2.10-rc2-manifest.json \
            --files "${FILES}" \
            --receipt release/.receipts/linux-smoke-receipt.json
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel tightbeam-macos \
            --manifest release/surf-ace-v0.2.10-rc2-manifest.json \
            --files "${FILES}" \
            --receipt release/.receipts/macos-smoke-receipt.json
      - name: Attest Linux smoke receipt
        id: attest-linux
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: release/.receipts/linux-smoke-receipt.json
      - name: Attest macOS smoke receipt
        id: attest-macos
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: release/.receipts/macos-smoke-receipt.json
      - name: Publish only after both verified receipts
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_ATTESTATION_URL: ${{ steps.attest-linux.outputs.attestation-url }}
          MACOS_ATTESTATION_URL: ${{ steps.attest-macos.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -n "${LINUX_ATTESTATION_URL}"
          test -n "${MACOS_ATTESTATION_URL}"
          gh release create "${PRODUCT_TAG}" \
            release/surf-ace-server-linux-x86_64-v0.2.10-rc2.tar.gz \
            release/surf-ace-cli-linux-x86_64-v0.2.10-rc2.tar.gz \
            release/surf-ace-electron-linux-x86_64-v0.2.10-rc2.zip \
            release/surf-ace-cli-macos-arm64-v0.2.10-rc2.tar.gz \
            release/surf-ace-electron-macos-arm64-v0.2.10-rc2.zip \
            release/surf-ace-skill-v0.2.10-rc2.md \
            release/surf-ace-v0.2.10-rc2-manifest.json \
            release/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Surf Ace v${PRODUCT_VERSION}" \
            --notes "Surf Ace v${PRODUCT_VERSION}. Linux smoke attestation: ${LINUX_ATTESTATION_URL}\nmacOS smoke attestation: ${MACOS_ATTESTATION_URL}"
