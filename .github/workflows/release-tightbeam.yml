  smoke-linux:
    if: ${{ (inputs.run_smoke || inputs.run_linux_smoke_only) && needs.assemble-linux.outputs.gate_state == 'passed' }}
    needs: [assemble-linux, guard]
    continue-on-error: true
    outputs:
      gate_state: ${{ steps.finalize.outputs.gate_state }}
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Download the Linux smoke candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-linux-candidate
          path: build/release/tightbeam
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux smoke host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            iproute2 libpq-dev postgresql-16 postgresql-client-16 util-linux \
            tar unzip x11-utils xauth xvfb
          for tool in ip unshare runuser xvfb-run Xvfb xauth xdpyinfo pg_config tar unzip timeout; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              echo "linux_smoke_required_tool_missing:${tool}" >&2
              exit 127
            fi
          done
          pg_bin="$(pg_config --bindir)"
          for tool in initdb postgres pg_ctl psql pg_basebackup pg_dump pg_restore; do
            if [[ ! -x "${pg_bin}/${tool}" ]]; then
              echo "linux_smoke_required_postgres_tool_missing:${pg_bin}/${tool}" >&2
              exit 127
            fi
          done
      - name: Prepare the exact candidate product and state driver
        run: |
          set -euo pipefail
          test "$(pg_config --version | cut -d' ' -f2 | cut -d. -f1)" = "${POSTGRES_VERSION}"
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
          pnpm --dir tooling fetch --frozen-lockfile
          pnpm --dir tooling install --offline --frozen-lockfile
      - name: Run PostgreSQL-backed server, packaged CLI, and Linux client acceptance
        id: linux-acceptance
        env:
          SURF_ACE_SMOKE_COMPONENT: linux
          SURF_ACE_TIGHTBEAM_STATE_DRIVER: ${{ github.workspace }}/tooling/scripts/release/tightbeam-state-smoke-fixture.ts
        run: |
          set -euo pipefail
          smoke_tmp="$(mktemp -d /tmp/sa.XXXXXX)"
          trap 'rm -rf "$smoke_tmp"' EXIT
          smoke_user="$(id -un)"
          smoke_node="$(command -v node)"
          timeout --signal=TERM --kill-after=10s 20m sudo -n env \
            PRODUCT_VERSION="${PRODUCT_VERSION}" \
            PRODUCT_TAG="${PRODUCT_TAG}" \
            TOOLING_TAG="${TOOLING_TAG}" \
            unshare --net -- bash -c '
            set -euo pipefail
            smoke_user=$1
            smoke_tmp=$2
            smoke_node=$3
            smoke_path=$4
            state_driver=$5
            product_commit=$6
            tooling_commit=$7
            ip link set lo up
            ip link add veth0 type veth peer name veth1
            ip addr add 198.18.0.1/30 dev veth0
            ip addr add 169.254.77.1/16 dev veth0
            ip link set veth0 up
            ip link set veth1 up
            ip route add 224.0.0.0/4 dev veth0
            ip -br addr >&2
            ip route >&2
            test -z "$(ip route show default)"
            exec runuser -u "$smoke_user" -- env \
              PATH="$smoke_path" TMPDIR="$smoke_tmp" \
              PRODUCT_COMMIT="$product_commit" \
              PRODUCT_TAG="$PRODUCT_TAG" \
              TOOLING_TAG="$TOOLING_TAG" \
              SURF_ACE_SMOKE_COMPONENT=linux \
              SURF_ACE_TIGHTBEAM_STATE_DRIVER="$state_driver" \
              xvfb-run -a "$smoke_node" tooling/scripts/release/smoke-tightbeam-release.mjs \
                --source-dir source \
                --source-commit "$product_commit" \
                --tooling-commit "$tooling_commit" \
                --candidate-commit "$product_commit" \
                --manifest "build/release/tightbeam/surf-ace-v${PRODUCT_VERSION}-manifest.json"
          ' bash "$smoke_user" "$smoke_tmp" "$smoke_node" "$PATH" \
            "$SURF_ACE_TIGHTBEAM_STATE_DRIVER" "$PRODUCT_COMMIT" "$GITHUB_SHA" \
            > linux-smoke.json 2> linux-smoke-stderr.log || {
              smoke_status=$?
              echo "Linux acceptance smoke failed with exit ${smoke_status}; diagnostic details follow." >&2
              if [[ "${smoke_status}" -eq 124 ]]; then
                echo "linux_smoke_packaged_acceptance_timeout_20m" >&2
              fi
              cat linux-smoke-stderr.log >&2
              if [[ -s linux-smoke.json ]]; then
                cat linux-smoke.json >&2
              fi
              mkdir -p linux-smoke-failure
              find "$smoke_tmp" -type f \( -name 'fresh-install-state.json' -o -name 'fresh-install-state.json.capture.png' \
                -o -name 'client-flight-recorder.log' \
                -o -name 'raw-cli-progress.ndjson' -o -name 'raw-cli-evidence.ndjson' \
                -o -name 'annotation-journal-progress.ndjson' \
                -o -name 'fresh-install.client-flight-recorder.log' -o -name 'fresh-install.second-client-flight-recorder.log' \
                -o -name 'fresh-install-registry.client-flight-recorder.log' -o -name 'primary.log' -o -name 'witness.log' \) \
                -exec cp {} linux-smoke-failure/ \;
              exit "${smoke_status}"
            }
      - name: Create Linux smoke receipt
        id: create-linux-smoke-receipt
        if: ${{ steps.linux-acceptance.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel tightbeam-linux \
            --manifest "build/release/tightbeam/surf-ace-v${PRODUCT_VERSION}-manifest.json" \
            --files "build/release/tightbeam/surf-ace-server-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,build/release/tightbeam/surf-ace-cli-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,build/release/tightbeam/surf-ace-electron-linux-x86_64-v${PRODUCT_VERSION}.zip" \
            --output linux-smoke-receipt.json
      - name: Retain Linux smoke result and receipt
        id: retain-linux-smoke
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-linux-smoke
          path: |
            linux-smoke.json
            linux-smoke-stderr.log
            linux-smoke-receipt.json
            build/release/tightbeam/surf-ace-v${{ env.PRODUCT_VERSION }}-manifest.json
            build/release/tightbeam/SHA256SUMS
            linux-smoke-failure/
          if-no-files-found: error

      - name: Report optional Linux smoke evidence gaps
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.retain-linux-smoke.outcome }}
        shell: bash
        run: |
          if [[ "${UPLOAD_OUTCOME:-unknown}" != "success" ]]; then
            printf '::warning::Linux smoke evidence could not be fully retained; Linux smoke status still determines Linux asset eligibility.\n'
            printf 'Linux smoke evidence retention was incomplete; smoke status still determines Linux asset eligibility.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report Linux smoke gate result
        id: finalize
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.linux-acceptance.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ACCEPTANCE_OUTCOME" == success ]]; then
            gate_state=passed
            printf 'Linux smoke passed.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$ACCEPTANCE_OUTCOME" == failure ]]; then
            gate_state=failed
            printf '::warning::Linux smoke did not pass; Linux assets were withheld while other eligible platform assets may proceed.\n'
            printf 'Linux smoke did not pass; Linux assets were withheld.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            gate_state=unavailable
            printf '::warning::Linux smoke was unavailable; Linux assets were withheld while other eligible platform assets may proceed.\n'
            printf 'Linux smoke was unavailable; Linux assets were withheld.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'gate_state=%s\n' "$gate_state" >> "$GITHUB_OUTPUT"

  smoke-macos:
    if: ${{ inputs.run_smoke && needs.assemble-macos.outputs.gate_state == 'passed' }}
    needs: [assemble-macos, guard]
