  assemble:
    if: ${{ always() && needs.guard.result == 'success' }}
    needs:
      - guard
      - build-linux
      - build-macos
      - compare-linux
      - compare-macos
      - compare-six-file-warning
      - assemble-linux
      - assemble-macos
      - smoke-linux
      - smoke-macos
      - test-ios
      - summarize-ios-tests
    outputs:
      has_linux: ${{ steps.select.outputs.has_linux }}
      has_macos: ${{ steps.select.outputs.has_macos }}
      components: ${{ steps.select.outputs.components }}
      linux_status: ${{ steps.select.outputs.linux_status }}
      macos_status: ${{ steps.select.outputs.macos_status }}
      skill_status: ${{ steps.select.outputs.skill_status }}
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
      RUN_SMOKE: ${{ inputs.run_smoke }}
      RUN_LINUX_ONLY: ${{ inputs.run_linux_smoke_only }}
      INCLUDE_LINUX: ${{ ((inputs.run_smoke || inputs.run_linux_smoke_only) && needs.smoke-linux.outputs.gate_state == 'passed') || (!(inputs.run_smoke || inputs.run_linux_smoke_only) && needs.assemble-linux.outputs.gate_state == 'passed') }}
      INCLUDE_MACOS: ${{ (inputs.run_smoke && needs.smoke-macos.outputs.gate_state == 'passed') || (!(inputs.run_smoke || inputs.run_linux_smoke_only) && needs.assemble-macos.outputs.gate_state == 'passed') }}
      LINUX_COMPARE_STATE: ${{ needs.compare-linux.outputs.gate_state }}
      MACOS_COMPARE_STATE: ${{ needs.compare-macos.outputs.gate_state }}
      LINUX_BUILD_RESULT: ${{ needs.build-linux.result }}
      MACOS_BUILD_RESULT: ${{ needs.build-macos.result }}
      LINUX_ASSEMBLY_STATE: ${{ needs.assemble-linux.outputs.gate_state }}
      MACOS_ASSEMBLY_STATE: ${{ needs.assemble-macos.outputs.gate_state }}
      LINUX_SMOKE_STATE: ${{ needs.smoke-linux.outputs.gate_state }}
      MACOS_SMOKE_STATE: ${{ needs.smoke-macos.outputs.gate_state }}
      IOS_TEST_STATE: ${{ needs.summarize-ios-tests.outputs.state }}
      ALL_ASSETS_COMPARE_STATE: ${{ needs.compare-six-file-warning.outputs.state }}
      VERSION_NAME_MISMATCH: ${{ needs.guard.outputs.version_name_mismatch }}
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Download Linux candidate when eligible
        if: env.INCLUDE_LINUX == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-linux-candidate
          path: build/candidates/linux
      - name: Download macOS candidate when eligible
        if: env.INCLUDE_MACOS == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-macos-candidate
          path: build/candidates/macos
      - name: Select components with complete candidate assets
        id: select
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release/tightbeam
          components=()
          linux_copy_state=not-selected
          macos_copy_state=not-selected
          copy_component() {
            local component="$1"
            shift
            local files=("$@")
            local copied=()
            for file in "${files[@]}"; do
              local source="build/candidates/${component}/${file}"
              if [[ ! -s "${source}" ]] || ! cp "${source}" build/release/tightbeam/; then
                for copied_file in "${copied[@]}"; do rm -f "build/release/tightbeam/${copied_file}"; done
                return 1
              fi
              copied+=("${file}")
            done
          }
          linux_files=(
            "surf-ace-server-linux-x86_64-v${PRODUCT_VERSION}.tar.gz"
            "surf-ace-cli-linux-x86_64-v${PRODUCT_VERSION}.tar.gz"
            "surf-ace-electron-linux-x86_64-v${PRODUCT_VERSION}.zip"
          )
          macos_files=(
            "surf-ace-cli-macos-arm64-v${PRODUCT_VERSION}.tar.gz"
            "surf-ace-electron-macos-arm64-v${PRODUCT_VERSION}.zip"
          )
          if [[ "${INCLUDE_LINUX}" == "true" ]]; then
            if copy_component linux "${linux_files[@]}"; then
              components+=(linux)
              linux_copy_state=passed
            else
              linux_copy_state=unavailable
              printf '::warning::Linux component candidate files were unavailable for final assembly.\n'
            fi
          fi
          if [[ "${INCLUDE_MACOS}" == "true" ]]; then
            if copy_component macos "${macos_files[@]}"; then
              components+=(macos)
              macos_copy_state=passed
            else
              macos_copy_state=unavailable
              printf '::warning::macOS component candidate files were unavailable for final assembly.\n'
            fi
          fi
          if [[ ${#components[@]} -eq 0 ]]; then
            printf 'No platform candidate passed its required build, comparison, assembly and smoke gates.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            echo "No platform candidate passed its required gates." >&2
            exit 1
          fi
          skill_status=unavailable
          skill_source="tooling/integrations/tightbeam/skills/surf-ace/SKILL.md"
          skill_asset="surf-ace-skill-v${PRODUCT_VERSION}.md"
          if [[ -s "${skill_source}" ]] && cp "${skill_source}" "build/release/tightbeam/${skill_asset}" && cmp -s "${skill_source}" "build/release/tightbeam/${skill_asset}"; then
            components+=(skill)
            skill_status=included
          else
            rm -f "build/release/tightbeam/${skill_asset}"
            printf '::warning::The shared skill asset was omitted because its pinned source bytes were unavailable or unverifiable.\n'
          fi
          components_csv="$(IFS=,; printf '%s' "${components[*]}")"
          printf 'components=%s\n' "${components_csv}" >> "$GITHUB_OUTPUT"
          printf 'has_linux=%s\n' "$( [[ " ${components[*]} " == *" linux "* ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          printf 'has_macos=%s\n' "$( [[ " ${components[*]} " == *" macos "* ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          printf 'Included platform components: %s\n' "${components_csv}" >> "$GITHUB_STEP_SUMMARY"
          linux_status='Withheld: no Linux candidate passed every required gate.'
          macos_status='Withheld: no macOS candidate passed every required gate.'
          if [[ " ${components[*]} " == *" linux "* ]]; then
            if [[ "$RUN_SMOKE" == true || "$RUN_LINUX_ONLY" == true ]]; then
              linux_status='Included after Linux build, product tests, platform comparison, assembly and smoke passed.'
            else
              linux_status='Candidate assembled after Linux build, product tests and platform comparison passed; smoke was not run.'
            fi
          elif [[ "$linux_copy_state" == unavailable ]]; then
            linux_status='Withheld because Linux candidate assets were unavailable during final assembly.'
          elif [[ "$LINUX_COMPARE_STATE" != passed ]]; then
            linux_status="Withheld because the Linux build/test job was ${LINUX_BUILD_RESULT:-unavailable} and its A/B comparison was ${LINUX_COMPARE_STATE:-unavailable}."
          elif [[ "$LINUX_ASSEMBLY_STATE" != passed ]]; then
            linux_status="Withheld because Linux candidate assembly state was ${LINUX_ASSEMBLY_STATE:-unavailable}."
          elif [[ "$RUN_SMOKE" == true || "$RUN_LINUX_ONLY" == true ]]; then
            linux_status="Withheld because Linux smoke state was ${LINUX_SMOKE_STATE:-unavailable}."
          fi
          if [[ " ${components[*]} " == *" macos "* ]]; then
            if [[ "$RUN_SMOKE" == true ]]; then
              macos_status='Included after macOS build, product tests, platform comparison, assembly and smoke passed.'
            else
              macos_status='Candidate assembled after macOS build, product tests and platform comparison passed; smoke was not run.'
            fi
          elif [[ "$RUN_LINUX_ONLY" == true ]]; then
            macos_status='Not included because Linux-only smoke was selected.'
          elif [[ "$macos_copy_state" == unavailable ]]; then
            macos_status='Withheld because macOS candidate assets were unavailable during final assembly.'
          elif [[ "$MACOS_COMPARE_STATE" != passed ]]; then
            macos_status="Withheld because the macOS build/test job was ${MACOS_BUILD_RESULT:-unavailable} and its A/B comparison was ${MACOS_COMPARE_STATE:-unavailable}."
          elif [[ "$MACOS_ASSEMBLY_STATE" != passed ]]; then
            macos_status="Withheld because macOS candidate assembly state was ${MACOS_ASSEMBLY_STATE:-unavailable}."
          elif [[ "$RUN_SMOKE" == true ]]; then
            macos_status="Withheld because macOS smoke state was ${MACOS_SMOKE_STATE:-unavailable}."
          fi
          printf 'linux_status=%s\n' "$linux_status" >> "$GITHUB_OUTPUT"
          printf 'macos_status=%s\n' "$macos_status" >> "$GITHUB_OUTPUT"
          printf 'skill_status=%s\n' "$skill_status" >> "$GITHUB_OUTPUT"
          printf 'Linux assets: %s\nmacOS assets: %s\n' "$linux_status" "$macos_status" >> "$GITHUB_STEP_SUMMARY"
          printf 'Shared skill asset: %s.\n' "$skill_status" >> "$GITHUB_STEP_SUMMARY"
          printf 'iOS XCTest state: %s.\n' "${IOS_TEST_STATE:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${ALL_ASSETS_COMPARE_STATE:-warning}" != passed ]]; then
            printf 'The informational six-file comparison was %s; per-platform comparisons govern asset eligibility.\n' \
              "${ALL_ASSETS_COMPARE_STATE:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${VERSION_NAME_MISMATCH:-false}" == true ]]; then
            printf 'The tooling and product tag version labels differ; product tag version controls asset names.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assemble final manifest and exact SHA256SUMS
        env:
          SURF_ACE_RELEASE_COMPONENT: manifest
          COMPONENTS: ${{ steps.select.outputs.components }}
        run: |
          set -euo pipefail
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          node tooling/scripts/release/build-tightbeam-release.mjs \
            --source-dir source \
            --output-dir build/release/tightbeam \
            --source-tag "${PRODUCT_TAG}" \
            --source-commit "${PRODUCT_COMMIT}" \
            --version "${PRODUCT_VERSION}" \
            --components "${COMPONENTS}" \
            --target "${LINUX_RUST_TARGET}"
      - name: Retain the smoke-approved release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-release-candidate
          path: build/release/tightbeam
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    if: >-
      ${{ always() && inputs.publish_release && inputs.run_smoke && needs.guard.result == 'success' &&
      needs.assemble.result == 'success' &&
      (needs.assemble.outputs.has_linux == 'true' || needs.assemble.outputs.has_macos == 'true') }}
    needs:
      - guard
      - build-linux
      - build-macos
      - compare-linux
      - compare-macos
      - compare-six-file-warning
      - assemble-linux
      - assemble-macos
      - smoke-linux
      - smoke-macos
      - test-ios
      - summarize-ios-tests
      - assemble
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
      PRODUCT_TAG: ${{ inputs.product_tag }}
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
      TOOLING_TAG: ${{ inputs.tooling_tag }}
      HAS_LINUX: ${{ needs.assemble.outputs.has_linux }}
      HAS_MACOS: ${{ needs.assemble.outputs.has_macos }}
      COMPONENTS: ${{ needs.assemble.outputs.components }}
      LINUX_STATUS: ${{ needs.assemble.outputs.linux_status }}
      MACOS_STATUS: ${{ needs.assemble.outputs.macos_status }}
      SKILL_STATUS: ${{ needs.assemble.outputs.skill_status }}
      IOS_TEST_STATE: ${{ needs.summarize-ios-tests.outputs.state }}
      IOS_TEST_BUILD_A: ${{ needs.summarize-ios-tests.outputs.build_a }}
      IOS_TEST_BUILD_B: ${{ needs.summarize-ios-tests.outputs.build_b }}
      SIX_FILE_COMPARE_STATE: ${{ needs.compare-six-file-warning.outputs.state }}
      VERSION_NAME_MISMATCH: ${{ needs.guard.outputs.version_name_mismatch }}
    environment: tightbeam-release
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Download the smoke-approved release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-release-candidate
          path: release
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify source identity and the final manifest and SHA256SUMS
        run: |
          set -euo pipefail
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { createHash } from "node:crypto";
          import { TIGHTBEAM, tightbeamComponentsForAssets } from "./tooling/scripts/release/tightbeam-release-config.mjs";
          import { verifyTightbeamChecksums } from "./tooling/scripts/release/smoke-tightbeam-release.mjs";
          const manifestPath = `release/${TIGHTBEAM.manifest}`;
          const manifest = JSON.parse(await fs.readFile(manifestPath, "utf8"));
          const components = tightbeamComponentsForAssets(manifest.assets?.map(({ name }) => name));
          if (JSON.stringify(components) !== JSON.stringify(manifest.components) ||
              JSON.stringify(components) !== JSON.stringify(process.env.COMPONENTS.split(",")) ||
              manifest.source?.commit !== process.env.PRODUCT_COMMIT || manifest.source?.tag !== process.env.PRODUCT_TAG ||
              manifest.tooling?.commit !== process.env.GITHUB_SHA || manifest.tooling?.tag !== process.env.TOOLING_TAG ||
              manifest.version !== process.env.PRODUCT_VERSION) {
            throw new Error("release_candidate_identity_or_component_mismatch");
          }
          await verifyTightbeamChecksums(manifestPath);
          for (const asset of manifest.assets) {
            const file = `release/${asset.name}`;
            const [metadata, bytes] = await Promise.all([fs.stat(file), fs.readFile(file)]);
            const digest = createHash("sha256").update(bytes).digest("hex");
            if (!metadata.isFile() || metadata.size !== asset.sizeBytes ||
                digest !== asset.sha256 || manifest.checksums?.[asset.name] !== digest) {
              throw new Error(`release_candidate_asset_digest_or_size_mismatch:${asset.name}`);
            }
          }
          NODE
      - name: Create Linux smoke receipt
        id: create-linux-receipt
        if: env.HAS_LINUX == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p release/.receipts
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel tightbeam-linux \
            --manifest "release/surf-ace-v${PRODUCT_VERSION}-manifest.json" \
            --files "release/surf-ace-server-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,release/surf-ace-cli-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,release/surf-ace-electron-linux-x86_64-v${PRODUCT_VERSION}.zip" \
            --output release/.receipts/linux-smoke-receipt.json
      - name: Create macOS smoke receipt
        id: create-macos-receipt
        if: env.HAS_MACOS == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p release/.receipts
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel tightbeam-macos \
            --manifest "release/surf-ace-v${PRODUCT_VERSION}-manifest.json" \
            --files "release/surf-ace-cli-macos-arm64-v${PRODUCT_VERSION}.tar.gz,release/surf-ace-electron-macos-arm64-v${PRODUCT_VERSION}.zip" \
            --output release/.receipts/macos-smoke-receipt.json
      - name: Verify Linux smoke receipt
        id: verify-linux-receipt
        if: ${{ env.HAS_LINUX == 'true' && steps.create-linux-receipt.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel tightbeam-linux \
            --manifest "release/surf-ace-v${PRODUCT_VERSION}-manifest.json" \
            --files "release/surf-ace-server-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,release/surf-ace-cli-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,release/surf-ace-electron-linux-x86_64-v${PRODUCT_VERSION}.zip" \
            --receipt release/.receipts/linux-smoke-receipt.json
      - name: Verify macOS smoke receipt
        id: verify-macos-receipt
        if: ${{ env.HAS_MACOS == 'true' && steps.create-macos-receipt.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel tightbeam-macos \
            --manifest "release/surf-ace-v${PRODUCT_VERSION}-manifest.json" \
            --files "release/surf-ace-cli-macos-arm64-v${PRODUCT_VERSION}.tar.gz,release/surf-ace-electron-macos-arm64-v${PRODUCT_VERSION}.zip" \
            --receipt release/.receipts/macos-smoke-receipt.json
      - name: Attest Linux smoke receipt
        id: attest-linux
        if: ${{ env.HAS_LINUX == 'true' && steps.verify-linux-receipt.outcome == 'success' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: release/.receipts/linux-smoke-receipt.json
      - name: Attest macOS smoke receipt
        id: attest-macos
        if: ${{ env.HAS_MACOS == 'true' && steps.verify-macos-receipt.outcome == 'success' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: release/.receipts/macos-smoke-receipt.json
      - name: Publish after included platform receipts verify
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_ATTESTATION_URL: ${{ steps.attest-linux.outputs.attestation-url }}
          MACOS_ATTESTATION_URL: ${{ steps.attest-macos.outputs.attestation-url }}
          LINUX_RECEIPT_OUTCOME: ${{ steps.verify-linux-receipt.outcome }}
          MACOS_RECEIPT_OUTCOME: ${{ steps.verify-macos-receipt.outcome }}
          LINUX_ATTESTATION_OUTCOME: ${{ steps.attest-linux.outcome }}
          MACOS_ATTESTATION_OUTCOME: ${{ steps.attest-macos.outcome }}
        run: |
          set -euo pipefail
          release_channel_args=()
          if [[ "${PRODUCT_VERSION}" =~ -rc[1-9][0-9]*$ ]]; then
            release_channel_args+=(--prerelease)
          fi
          cat > release-notes.md <<EOF
          Surf Ace v${PRODUCT_VERSION}.

          Included components: ${COMPONENTS}.
          Linux: ${LINUX_STATUS}
          macOS: ${MACOS_STATUS}
          Shared skill asset: ${SKILL_STATUS}
          iOS app: not included in this release. The iOS XCTest lanes were build-a=${IOS_TEST_BUILD_A:-unavailable} and build-b=${IOS_TEST_BUILD_B:-unavailable} (${IOS_TEST_STATE:-unavailable}).

          The informational six-file comparison state was ${SIX_FILE_COMPARE_STATE:-unavailable}; per-platform comparisons determine asset eligibility.
          EOF
          if [[ "${IOS_TEST_STATE:-unavailable}" != passed ]]; then
            printf '\nThe iOS app is withheld because the complete iOS XCTest result was %s.\n' \
              "${IOS_TEST_STATE:-unavailable}" >> release-notes.md
          fi
          if [[ "${VERSION_NAME_MISMATCH:-false}" == true ]]; then
            printf '\nThe tooling tag version label differs from the product tag version label; exact tag pins remain required, asset names follow the product version, and smoke still checks the app version.\n' \
              >> release-notes.md
          fi
          if [[ "${HAS_LINUX}" != true ]]; then
            printf '\nWithheld Linux assets: surf-ace-server-linux-x86_64-v%s.tar.gz, surf-ace-cli-linux-x86_64-v%s.tar.gz, surf-ace-electron-linux-x86_64-v%s.zip.\n' \
              "${PRODUCT_VERSION}" "${PRODUCT_VERSION}" "${PRODUCT_VERSION}" >> release-notes.md
          fi
          if [[ "${HAS_MACOS}" != true ]]; then
            printf '\nWithheld macOS assets: surf-ace-cli-macos-arm64-v%s.tar.gz, surf-ace-electron-macos-arm64-v%s.zip.\n' \
              "${PRODUCT_VERSION}" "${PRODUCT_VERSION}" >> release-notes.md
          fi
          if [[ "${SKILL_STATUS}" != included ]]; then
            printf '\nWithheld shared skill asset: surf-ace-skill-v%s.md; its pinned tooling source was unavailable or its copied bytes did not verify.\n' \
              "${PRODUCT_VERSION}" >> release-notes.md
          fi
          if [[ "${HAS_LINUX}" == true ]]; then
            if [[ "${LINUX_RECEIPT_OUTCOME:-}" == success && "${LINUX_ATTESTATION_OUTCOME:-}" == success && -n "${LINUX_ATTESTATION_URL:-}" ]]; then
              printf '\nLinux smoke attestation: %s\n' "${LINUX_ATTESTATION_URL}" >> release-notes.md
            else
              printf '\nLinux smoke passed; its receipt or attestation could not be retained.\n' >> release-notes.md
              printf '::warning::Linux smoke passed, but its receipt or attestation evidence is unavailable.\n'
            fi
          fi
          if [[ "${HAS_MACOS}" == true ]]; then
            if [[ "${MACOS_RECEIPT_OUTCOME:-}" == success && "${MACOS_ATTESTATION_OUTCOME:-}" == success && -n "${MACOS_ATTESTATION_URL:-}" ]]; then
              printf '\nmacOS smoke attestation: %s\n' "${MACOS_ATTESTATION_URL}" >> release-notes.md
            else
              printf '\nmacOS smoke passed; its receipt or attestation could not be retained.\n' >> release-notes.md
              printf '::warning::macOS smoke passed, but its receipt or attestation evidence is unavailable.\n'
            fi
          fi
          node --input-type=module > release-asset-list.txt <<'NODE'
          import fs from "node:fs/promises";
          import { TIGHTBEAM, tightbeamComponentsForAssets } from "./tooling/scripts/release/tightbeam-release-config.mjs";
          const manifest = JSON.parse(await fs.readFile(`release/${TIGHTBEAM.manifest}`, "utf8"));
          const components = tightbeamComponentsForAssets(manifest.assets.map(({ name }) => name));
          if (JSON.stringify(components) !== JSON.stringify(process.env.COMPONENTS.split(","))) {
            throw new Error("release_asset_component_set_mismatch");
          }
          for (const asset of manifest.assets) console.log(asset.name);
          console.log(TIGHTBEAM.manifest);
          console.log(TIGHTBEAM.checksums);
          NODE
          asset_names=()
          while IFS= read -r asset_name || [[ -n "${asset_name:-}" ]]; do
            asset_names+=("${asset_name}")
          done < release-asset-list.txt
          test "${#asset_names[@]}" -ge 4
          release_assets=()
          for name in "${asset_names[@]}"; do
            test -s "release/${name}"
            release_assets+=("release/${name}")
          done
          gh release create "${PRODUCT_TAG}" \
            "${release_assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            "${release_channel_args[@]+"${release_channel_args[@]}"}" \
            --title "Surf Ace v${PRODUCT_VERSION}" \
            --notes-file release-notes.md
