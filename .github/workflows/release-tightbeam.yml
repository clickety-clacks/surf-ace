name: Build standalone Surf Ace release

on:
  workflow_dispatch:
    inputs:
      product_tag:
        description: Unique immutable product source tag; its version determines public asset names.
        required: true
        type: string
      tooling_tag:
        description: Unique immutable tooling tag for this workflow commit.
        required: true
        type: string
      product_commit:
        description: Full commit SHA selected for the product tag; it must resolve to this exact commit.
        required: true
        type: string
      run_smoke:
        description: Run each eligible platform smoke after its build, tests and platform comparison pass.
        required: true
        type: boolean
        default: false
      run_linux_smoke_only:
        description: Run only the network-isolated Linux smoke; leave run_smoke and publish_release false.
        required: true
        type: boolean
        default: false
      publish_release:
        description: Publish assets only for platforms that pass their smoke checks.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: surf-ace-${{ inputs.product_tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.3.0
  PNPM_VERSION: 10.15.1
  POSTGRES_VERSION: "16"
  PRODUCT_TAG: ${{ inputs.product_tag }}
  RUST_VERSION: 1.89.0
  LINUX_RUST_TARGET: x86_64-unknown-linux-gnu
  MACOS_RUST_TARGET: aarch64-apple-darwin
  TOOLING_TAG: ${{ inputs.tooling_tag }}

jobs:
  guard:
    runs-on: macos-15
    outputs:
      product_commit: ${{ steps.identity.outputs.product_commit }}
      product_version: ${{ steps.identity.outputs.product_version }}
      tooling_version: ${{ steps.identity.outputs.tooling_version }}
      version_name_mismatch: ${{ steps.identity.outputs.version_name_mismatch }}
    steps:
      - name: Require exact manual tooling and immutable release tags
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_COMMIT_INPUT: ${{ inputs.product_commit }}
          PRODUCT_TAG_INPUT: ${{ inputs.product_tag }}
          TOOLING_TAG_INPUT: ${{ inputs.tooling_tag }}
        run: |
          set -euo pipefail
          [[ "${PRODUCT_COMMIT_INPUT}" =~ ^[a-f0-9]{40}$ ]]
          if [[ "${PRODUCT_TAG_INPUT}" =~ ^surf-ace-v([0-9]+\.[0-9]+\.[0-9]+(-rc[1-9][0-9]*)?)-(r[1-9][0-9]*)$ ]]; then
            product_version="${BASH_REMATCH[1]}"
          else
            echo "product_tag_invalid" >&2
            exit 1
          fi
          if [[ "${TOOLING_TAG_INPUT}" =~ ^surf-ace-release-tooling-v([0-9]+\.[0-9]+\.[0-9]+(-rc[1-9][0-9]*)?)-(r[1-9][0-9]*)$ ]]; then
            tooling_version="${BASH_REMATCH[1]}"
          else
            echo "tooling_tag_invalid" >&2
            exit 1
          fi
          version_name_mismatch=false
          if [[ "${tooling_version}" != "${product_version}" ]]; then
            version_name_mismatch=true
            echo "::warning::The tooling tag version label differs; exact tag pins remain required, asset names follow the product tag, and platform smoke still checks the app version."
            printf 'The tooling tag version label differs; exact tag pins remain required, asset names follow the product tag, and platform smoke still checks the app version.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          peel_tag() {
            read -r object_type object_sha <<EOF
          $(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1" --jq '.object.type + " " + .object.sha')
          EOF
            while test "${object_type}" = tag; do
              read -r object_type object_sha <<EOF
          $(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.type + " " + .object.sha')
          EOF
            done
            test "${object_type}" = commit
            printf '%s\n' "${object_sha}"
          }
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REF_TYPE}" = tag
          test "${GITHUB_REF}" = "refs/tags/${TOOLING_TAG}"
          tooling_remote="$(peel_tag "${TOOLING_TAG}")"
          product_remote="$(peel_tag "${PRODUCT_TAG}")"
          test "${tooling_remote}" = "${GITHUB_SHA}"
          test "${product_remote}" = "${PRODUCT_COMMIT_INPUT}"
          printf 'product_commit=%s\n' "${product_remote}" >> "${GITHUB_OUTPUT}"
          printf 'product_version=%s\n' "${product_version}" >> "${GITHUB_OUTPUT}"
          printf 'tooling_version=%s\n' "${tooling_version}" >> "${GITHUB_OUTPUT}"
          printf 'version_name_mismatch=%s\n' "${version_name_mismatch}" >> "${GITHUB_OUTPUT}"

  build-linux:
    needs: guard
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
    strategy:
      fail-fast: false
      matrix:
        lane: [build-a, build-b]
    runs-on: ubuntu-24.04
    container:
      image: rust:1.89.0-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Install checksum-pinned Node and pnpm
        run: |
          set -euo pipefail
          curl -fsSLO https://nodejs.org/dist/v24.3.0/node-v24.3.0-linux-x64.tar.xz
          printf '%s  %s\n' a962afadaa8b94bae8bff87ddd6c11f7aae621032424ef05c0a4fe2537fa4de0 node-v24.3.0-linux-x64.tar.xz | sha256sum -c -
          tar -xJf node-v24.3.0-linux-x64.tar.xz -C /usr/local --strip-components=1
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(rustc --version | cut -d' ' -f2)" = "${RUST_VERSION}"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
      - name: Install frozen dependencies and run Linux product tests
        run: |
          set -euo pipefail
          guard() {
            git -C source diff --exit-code HEAD -- .
            git -C source diff --cached --exit-code HEAD -- .
          }
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
          guard
          pnpm --dir source --filter @surf-ace/protocol build
          guard
          pnpm --dir source --filter @surf-ace/allocator build
          guard
          pnpm --dir source --filter @surf-ace/controller build
          guard
          pnpm --dir source --filter @surf-ace/controller test
          guard
          pnpm --dir source --filter @surf-ace/protocol test
          guard
          cargo test --manifest-path source/packages/cli/Cargo.toml --locked
          guard
      - name: Build standalone Linux server, CLI and Electron assets
        env:
          SURF_ACE_RELEASE_COMPONENT: linux
        run: |
          set -euo pipefail
          node tooling/scripts/release/build-tightbeam-release.mjs \
            --source-dir source \
            --output-dir build/release/tightbeam \
            --source-tag "${PRODUCT_TAG}" \
            --source-commit "${PRODUCT_COMMIT}" \
            --version "${PRODUCT_VERSION}" \
            --target "${LINUX_RUST_TARGET}"
      - name: Include the shared skill asset when its pinned bytes are available
        shell: bash
        run: |
          set -euo pipefail
          skill_source="tooling/integrations/tightbeam/skills/surf-ace/SKILL.md"
          skill_asset="build/release/tightbeam/surf-ace-skill-v${PRODUCT_VERSION}.md"
          if [[ -s "${skill_source}" ]] && cp "${skill_source}" "${skill_asset}" && cmp -s "${skill_source}" "${skill_asset}"; then
            printf 'The shared skill asset was copied from the pinned tooling source and will be included only if final manifest verification succeeds.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f "${skill_asset}"
            printf '::warning::The shared skill asset was unavailable or could not be verified; qualified Linux assets remain eligible.\n'
            printf 'The shared skill asset was unavailable or could not be verified; qualified Linux assets remain eligible.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain deterministic Linux assets and optional shared skill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-linux-${{ matrix.lane }}
          path: |
            build/release/tightbeam/surf-ace-server-linux-x86_64-v${{ env.PRODUCT_VERSION }}.tar.gz
            build/release/tightbeam/surf-ace-cli-linux-x86_64-v${{ env.PRODUCT_VERSION }}.tar.gz
            build/release/tightbeam/surf-ace-electron-linux-x86_64-v${{ env.PRODUCT_VERSION }}.zip
            build/release/tightbeam/surf-ace-skill-v${{ env.PRODUCT_VERSION }}.md
          if-no-files-found: warn
          retention-days: 30
      - name: Remove job-owned checkout and build paths
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}/source" "${GITHUB_WORKSPACE}/tooling" "${GITHUB_WORKSPACE}/build"

  build-macos:
    needs: guard
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
      EVIDENCE_DIR: ${{ github.workspace }}/release-evidence/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      EVIDENCE_READBACK_DIR: ${{ github.workspace }}/release-evidence-readback/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      EVIDENCE_ARTIFACT: surf-ace-macos-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [build-a, build-b]
    runs-on: xcode-27
    steps:
      - name: Prepare run-isolated macOS evidence
        id: prepare-macos-evidence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_ref=%s\n' "$GITHUB_REF"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'lane=%s\n' '${{ matrix.lane }}'
            printf 'runner_name=%s\n' "${RUNNER_NAME:-unknown}"
            printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
            printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'product_tag=%s\n' "$PRODUCT_TAG"
            printf 'product_commit=%s\n' "$PRODUCT_COMMIT"
            printf 'tooling_tag=%s\n' "$TOOLING_TAG"
            printf 'tooling_commit=%s\n' "$GITHUB_SHA"
            printf 'started_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf '\n--- macOS ---\n'
            sw_vers
            uname -a
          } > "$EVIDENCE_DIR/run-identity.txt"

      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Pin Node and select Xcode 27.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install frozen dependencies and run macOS product tests
        id: macos-tests
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.0.0.app
          test "$(xcodebuild -version | head -1)" = "Xcode 27.0"
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
          guard() {
            git -C source diff --exit-code HEAD -- .
            git -C source diff --cached --exit-code HEAD -- .
          }
          guard
          pnpm --dir source --filter @surf-ace/protocol build
          pnpm --dir source --filter @surf-ace/allocator build
          pnpm --dir source --filter @surf-ace/controller build
          pnpm --dir source --filter @surf-ace/electron build
          guard
          pnpm --dir source --filter @surf-ace/controller test
          pnpm --dir source --filter @surf-ace/protocol test
          python3 -m venv "${RUNNER_TEMP}/surf-ace-test-python"
          "${RUNNER_TEMP}/surf-ace-test-python/bin/python3" -m pip install jsonschema==4.25.1
          export PATH="${RUNNER_TEMP}/surf-ace-test-python/bin:${PATH}"
          pnpm --dir source --filter @surf-ace/electron test
          guard

      - name: Capture macOS build and runner evidence
        id: capture-macos-evidence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MACOS_TEST_STEP_OUTCOME: ${{ steps.macos-tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf 'macos_product_test_step_outcome=%s\n' "${MACOS_TEST_STEP_OUTCOME:-not-run}" \
            > "$EVIDENCE_DIR/test-step-outcome.txt"

          capture_tool() {
            local output="$1"
            shift
            if "$@" > "$EVIDENCE_DIR/$output" 2>&1; then
              printf 'exit_code=0\n' > "$EVIDENCE_DIR/$output.status"
            else
              local exit_code=$?
              printf 'exit_code=%s\n' "$exit_code" > "$EVIDENCE_DIR/$output.status"
            fi
          }

          capture_tool developer-directory.txt xcode-select -p
          capture_tool xcode-version.txt xcodebuild -version
          capture_tool xcode-sdks.txt xcodebuild -showsdks
          capture_tool swift-version.txt swift --version
          capture_tool ios-simulator-sdk-version.txt xcrun --sdk iphonesimulator --show-sdk-version
          capture_tool simulator-runtimes.txt xcrun simctl list runtimes
          capture_tool simulator-devices.txt xcrun simctl list devices available

          if [[ -d source/.git ]]; then
            {
              printf 'expected_product_commit=%s\n' "$PRODUCT_COMMIT"
              printf 'source_commit='
              git -C source rev-parse HEAD || printf 'unavailable\n'
              printf 'source_tree='
              git -C source rev-parse 'HEAD^{tree}' || printf 'unavailable\n'
              printf 'source_status:\n'
              git -C source status --short --branch || true
            } > "$EVIDENCE_DIR/source-identity.txt" 2>&1
          else
            printf 'source_checkout=unavailable\nexpected_product_commit=%s\n' "$PRODUCT_COMMIT" \
              > "$EVIDENCE_DIR/source-identity.txt"
          fi

          if [[ -d tooling/.git ]]; then
            {
              printf 'expected_tooling_commit=%s\n' "$GITHUB_SHA"
              printf 'tooling_commit='
              git -C tooling rev-parse HEAD || printf 'unavailable\n'
              printf 'tooling_tree='
              git -C tooling rev-parse 'HEAD^{tree}' || printf 'unavailable\n'
              printf 'tooling_status:\n'
              git -C tooling status --short --branch || true
            } > "$EVIDENCE_DIR/tooling-identity.txt" 2>&1
          else
            printf 'tooling_checkout=unavailable\nexpected_tooling_commit=%s\n' "$GITHUB_SHA" \
              > "$EVIDENCE_DIR/tooling-identity.txt"
          fi

          printf 'The full iOS XCTest suite runs in the independent test-ios job.\n' \
            > "$EVIDENCE_DIR/ios-test-job.txt"

          printf 'finished_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > "$EVIDENCE_DIR/evidence-captured-at.txt"
          python3 - "$EVIDENCE_DIR" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          excluded = {"capture-manifest.json", "capture-readback.json"}

          def file_digest(path):
              digest = hashlib.sha256()
              size = 0
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      size += len(chunk)
                      digest.update(chunk)
              return size, digest.hexdigest()

          entries = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name not in excluded:
                  size, digest = file_digest(path)
                  entries.append({"path": path.relative_to(root).as_posix(), "size_bytes": size, "sha256": digest})
          manifest_path = root / "capture-manifest.json"
          manifest_path.write_text(json.dumps({"files": entries}, indent=2) + "\n", encoding="utf-8")
          errors = []
          total_bytes = 0
          for entry in entries:
              path = root / entry["path"]
              if not path.is_file():
                  errors.append(f"missing:{entry['path']}")
                  continue
              size, digest = file_digest(path)
              total_bytes += size
              if size != entry["size_bytes"] or digest != entry["sha256"]:
                  errors.append(f"mismatch:{entry['path']}")
          readback = {"status": "PASS" if not errors else "FAIL", "file_count": len(entries),
                      "verified_size_bytes": total_bytes,
                      "capture_manifest_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
                      "errors": errors}
          (root / "capture-readback.json").write_text(json.dumps(readback, indent=2) + "\n", encoding="utf-8")
          if errors:
              raise SystemExit("macOS release evidence manifest verification failed")
          PY

      - name: Retain macOS release evidence
        if: always()
        id: upload-macos-evidence
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Download retained macOS evidence for readback
        id: download-macos-evidence-readback
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: ${{ env.EVIDENCE_READBACK_DIR }}
      - name: Verify retained macOS evidence readback
        id: verify-macos-evidence-readback
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if python3 - "$EVIDENCE_READBACK_DIR" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest_path = root / "capture-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          errors = []
          for entry in manifest.get("files", []):
              path = root / entry["path"]
              if not path.is_file():
                  errors.append(f"missing:{entry['path']}")
                  continue
              digest = hashlib.sha256()
              size = 0
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      size += len(chunk)
                      digest.update(chunk)
              if size != entry["size_bytes"] or digest.hexdigest() != entry["sha256"]:
                  errors.append(f"mismatch:{entry['path']}")
          readback = json.loads((root / "capture-readback.json").read_text(encoding="utf-8"))
          if readback.get("status") != "PASS":
              errors.append("staging-readback-failed")
          if readback.get("capture_manifest_sha256") != hashlib.sha256(manifest_path.read_bytes()).hexdigest():
              errors.append("manifest-digest-mismatch")
          if errors:
              raise SystemExit(";".join(errors))
          print(len(manifest.get("files", [])))
          PY
          then
            printf 'PASS\n' > "$EVIDENCE_DIR/evidence-readback-status.txt"
            manifest_sha256="$(shasum -a 256 "$EVIDENCE_READBACK_DIR/capture-manifest.json" | awk '{print $1}')"
            {
              printf 'Verified the uploaded evidence after artifact download.\n'
              printf 'Capture manifest SHA-256: %s\n' "$manifest_sha256"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'FAIL\n' > "$EVIDENCE_DIR/evidence-readback-status.txt"
            printf 'The uploaded macOS evidence could not be verified after download.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Report optional macOS evidence gaps
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare-macos-evidence.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture-macos-evidence.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-macos-evidence.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-macos-evidence-readback.outcome }}
          READBACK_OUTCOME: ${{ steps.verify-macos-evidence-readback.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          outcomes=(
            "${PREPARE_OUTCOME:-unknown}"
            "${CAPTURE_OUTCOME:-unknown}"
            "${UPLOAD_OUTCOME:-unknown}"
            "${DOWNLOAD_OUTCOME:-unknown}"
            "${READBACK_OUTCOME:-unknown}"
          )
          if [[ " ${outcomes[*]} " == *" failure "* || " ${outcomes[*]} " == *" cancelled "* || " ${outcomes[*]} " == *" unknown "* ]]; then
            printf '::warning::Optional macOS diagnostic evidence was incomplete; product qualification remains based on the macOS tests and asset build.\n'
            printf 'Optional macOS diagnostic evidence was incomplete. macOS product tests and asset build remain the qualification gates.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Optional macOS diagnostic evidence was captured and verified.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build standalone macOS CLI and Electron assets
        env:
          SURF_ACE_RELEASE_COMPONENT: macos
        run: |
          set -euo pipefail
          node tooling/scripts/release/build-tightbeam-release.mjs \
            --source-dir source \
            --output-dir build/release/tightbeam \
            --source-tag "${PRODUCT_TAG}" \
            --source-commit "${PRODUCT_COMMIT}" \
            --version "${PRODUCT_VERSION}"
      - name: Retain deterministic macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-macos-${{ matrix.lane }}
          path: |
            build/release/tightbeam/surf-ace-cli-macos-arm64-v${{ env.PRODUCT_VERSION }}.tar.gz
            build/release/tightbeam/surf-ace-electron-macos-arm64-v${{ env.PRODUCT_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30
      - name: Remove job-owned checkout and build paths
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}/source" "${GITHUB_WORKSPACE}/tooling" "${GITHUB_WORKSPACE}/build"

  # The desktop/Linux release graph is independent of the iOS test result.
  test-ios:
    name: iOS XCTest (${{ matrix.lane }})
    needs: guard
    continue-on-error: true
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
      IOS_EVIDENCE_DIR: ${{ github.workspace }}/ios-test-evidence/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      RESULT_BUNDLE: ${{ github.workspace }}/ios-test-evidence/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}/native-tests.xcresult
    strategy:
      fail-fast: false
      matrix:
        lane: [build-a, build-b]
    runs-on: xcode-27
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare run-isolated iOS test evidence
        run: mkdir -p "$IOS_EVIDENCE_DIR"
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Select Xcode and verify exact source and simulator
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.0.0.app
          xcodebuild -version | tee "$IOS_EVIDENCE_DIR/xcode-version.txt"
          test "$(xcodebuild -version | head -1)" = "Xcode 27.0"
          xcrun simctl list runtimes | tee "$IOS_EVIDENCE_DIR/simulator-runtimes.txt" | grep -F 'iOS 27.0'
          xcrun simctl list devices available | tee "$IOS_EVIDENCE_DIR/simulator-devices.txt" | grep -F 'iPad Pro 13-inch (M5)'
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          {
            printf 'tooling_commit=%s\n' "$(git -C tooling rev-parse HEAD)"
            printf 'tooling_tree=%s\n' "$(git -C tooling rev-parse 'HEAD^{tree}')"
            printf 'product_tag=%s\n' "${PRODUCT_TAG}"
            printf 'product_commit=%s\n' "$(git -C source rev-parse HEAD)"
            printf 'product_tree=%s\n' "$(git -C source rev-parse 'HEAD^{tree}')"
          } > "$IOS_EVIDENCE_DIR/source-tooling-identity.txt"
      - name: Run the complete iOS XCTest suite
        id: ios-tests
        run: |
          set -euo pipefail
          command=(
            xcodebuild test \
            -project source/packages/ios/SurfAce.xcodeproj \
            -scheme SurfAce \
            -configuration Release \
            ENABLE_TESTABILITY=YES \
            -parallel-testing-enabled NO \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=27.0' \
            -resultBundlePath "$RESULT_BUNDLE"
          )
          printf '%q ' "${command[@]}" > "$IOS_EVIDENCE_DIR/xcodebuild-command.txt"
          printf '\n' >> "$IOS_EVIDENCE_DIR/xcodebuild-command.txt"
          set +e
          "${command[@]}" 2>&1 | tee "$IOS_EVIDENCE_DIR/xcodebuild.log"
          pipeline_status=( "${PIPESTATUS[@]}" )
          set -e
          xcodebuild_exit_code="${pipeline_status[0]}"
          tee_exit_code="${pipeline_status[1]}"
          printf '%s\n' "$xcodebuild_exit_code" > "$IOS_EVIDENCE_DIR/xcodebuild-exit-code.txt"
          printf '%s\n' "$tee_exit_code" > "$IOS_EVIDENCE_DIR/xcodebuild-tee-exit-code.txt"
          if [[ "$xcodebuild_exit_code" != 0 ]]; then
            exit "$xcodebuild_exit_code"
          fi
          if [[ "$tee_exit_code" != 0 ]]; then
            exit "$tee_exit_code"
          fi
      - name: Verify checked-out source and tooling remain unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          git -C tooling diff --exit-code HEAD -- .
          git -C tooling diff --cached --exit-code HEAD -- .
          git -C source diff --exit-code HEAD -- .
          git -C source diff --cached --exit-code HEAD -- .
      - name: Retain iOS XCTest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surf-ace-ios-xctest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ env.IOS_EVIDENCE_DIR }}/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Remove job-owned checkout paths
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}/source" "${GITHUB_WORKSPACE}/tooling"

  summarize-ios-tests:
    if: ${{ always() && needs.guard.result == 'success' }}
    needs: [guard, test-ios]
    continue-on-error: true
    outputs:
      state: ${{ steps.summarize.outputs.state }}
      build_a: ${{ steps.summarize.outputs.build_a }}
      build_b: ${{ steps.summarize.outputs.build_b }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download iOS XCTest evidence when available
        id: download-ios-evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: surf-ace-ios-xctest-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: false
          path: ios-test-evidence
      - name: Report iOS XCTest outcome without blocking other platforms
        id: summarize
        if: always()
        shell: bash
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/ios-test-evidence
        run: |
          set -euo pipefail
          lane_state() {
            local lane="$1"
            local code_file
            code_file="$(find "$EVIDENCE_DIR" -type f -name xcodebuild-exit-code.txt -path "*-${lane}/*" -print -quit 2>/dev/null || true)"
            if [[ -z "$code_file" ]]; then
              printf 'unavailable'
            elif [[ "$(tr -d '\r\n' < "$code_file")" == "0" ]]; then
              printf 'passed'
            else
              printf 'failed'
            fi
          }
          build_a="$(lane_state build-a)"
          build_b="$(lane_state build-b)"
          state=passed
          if [[ "$build_a" == failed || "$build_b" == failed ]]; then
            state=failed
          elif [[ "$build_a" != passed || "$build_b" != passed ]]; then
            state=unavailable
          fi
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          printf 'build_a=%s\n' "$build_a" >> "$GITHUB_OUTPUT"
          printf 'build_b=%s\n' "$build_b" >> "$GITHUB_OUTPUT"
          printf 'iOS XCTest lanes: build-a=%s; build-b=%s.\n' "$build_a" "$build_b" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$state" != passed ]]; then
            printf '::warning::The iOS app is withheld because the complete iOS XCTest result is %s; other platform assets retain their own gates.\n' "$state"
          fi

  retain-macos-job-logs:
    if: always()
    needs: [build-macos]
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    env:
      JOB_EVIDENCE_DIR: ${{ github.workspace }}/macos-job-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      JOB_LOG_ARTIFACT: surf-ace-macos-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Prepare run-isolated job log evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_EVIDENCE_DIR"
          mkdir -p "$JOB_EVIDENCE_DIR/job-logs"
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_ref=%s\n' "$GITHUB_REF"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'started_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$JOB_EVIDENCE_DIR/run-identity.txt"
      - name: Download completed macOS job logs
        id: download-macos-logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100"
          if curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "$jobs_url" --output "$JOB_EVIDENCE_DIR/jobs.json"; then
            python3 - "$JOB_EVIDENCE_DIR/jobs.json" "$JOB_EVIDENCE_DIR/macos-jobs.tsv" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              for job in payload.get("jobs", []):
                  name = job.get("name", "")
                  if name.startswith("build-macos"):
                      fields = [job.get("id", ""), name, job.get("conclusion") or "", job.get("runner_name") or ""]
                      output.write("\t".join(str(field).replace("\t", " ").replace("\n", " ") for field in fields) + "\n")
          PY
          else
            printf '{"jobs":[]}\n' > "$JOB_EVIDENCE_DIR/jobs.json"
            : > "$JOB_EVIDENCE_DIR/macos-jobs.tsv"
          fi

          downloaded=0
          failed=0
          while IFS=$'\t' read -r job_id job_name conclusion runner_name; do
            [[ -n "$job_id" ]] || continue
            safe_name="$(printf '%s' "$job_name" | tr -cs 'A-Za-z0-9._-' '-')"
            log_path="$JOB_EVIDENCE_DIR/job-logs/${job_id}-${safe_name}.txt"
            log_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs"
            if curl --fail --silent --show-error --location --retry 2 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "$log_url" --output "$log_path"; then
              downloaded=$((downloaded + 1))
            else
              failed=$((failed + 1))
              rm -f "$log_path"
            fi
          done < "$JOB_EVIDENCE_DIR/macos-jobs.tsv"
          if [[ ! -s "$JOB_EVIDENCE_DIR/macos-jobs.tsv" ]]; then
            printf 'No completed macOS build job logs were available.\n' \
              > "$JOB_EVIDENCE_DIR/job-logs-unavailable.txt"
          fi
          {
            printf 'macos_job_logs_downloaded=%s\n' "$downloaded"
            printf 'macos_job_logs_failed=%s\n' "$failed"
          } > "$JOB_EVIDENCE_DIR/job-log-capture-status.txt"
          if [[ "$downloaded" -eq 0 || "$failed" -gt 0 ]]; then
            printf '::warning::macOS job-log evidence is incomplete; platform asset gates are unchanged.\n'
          fi
      - name: Hash and verify macOS job logs
        id: verify-macos-logs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$JOB_EVIDENCE_DIR" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          excluded = {"job-log-manifest.json", "job-log-readback.json"}

          def file_digest(path):
              digest = hashlib.sha256()
              size = 0
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      size += len(chunk)
                      digest.update(chunk)
              return size, digest.hexdigest()

          entries = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name not in excluded:
                  size, digest = file_digest(path)
                  entries.append({"path": path.relative_to(root).as_posix(), "size_bytes": size, "sha256": digest})
          manifest_path = root / "job-log-manifest.json"
          manifest_path.write_text(json.dumps({"files": entries}, indent=2) + "\n", encoding="utf-8")
          errors = []
          total_bytes = 0
          for entry in entries:
              path = root / entry["path"]
              if not path.is_file():
                  errors.append(f"missing:{entry['path']}")
                  continue
              size, digest = file_digest(path)
              total_bytes += size
              if size != entry["size_bytes"] or digest != entry["sha256"]:
                  errors.append(f"mismatch:{entry['path']}")
          readback = {"status": "PASS" if not errors else "FAIL", "file_count": len(entries),
                      "verified_size_bytes": total_bytes,
                      "manifest_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(), "errors": errors}
          readback_path = root / "job-log-readback.json"
          readback_path.write_text(json.dumps(readback, indent=2) + "\n", encoding="utf-8")
          if errors:
              raise SystemExit("macOS job log manifest verification failed")
          PY
      - name: Retain macOS job logs and size/SHA manifest
        id: retain-macos-logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.JOB_LOG_ARTIFACT }}
          path: ${{ env.JOB_EVIDENCE_DIR }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Report optional macOS job-log evidence gaps
        if: always()
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download-macos-logs.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-macos-logs.outcome }}
          RETAIN_OUTCOME: ${{ steps.retain-macos-logs.outcome }}
        shell: bash
        run: |
          if [[ "${DOWNLOAD_OUTCOME:-unknown}" != success || "${VERIFY_OUTCOME:-unknown}" != success || "${RETAIN_OUTCOME:-unknown}" != success ]]; then
            printf '::warning::macOS job-log evidence was unavailable or incomplete; platform eligibility remains governed by product tests, build, comparison and smoke.\n'
            printf 'macOS job-log evidence was unavailable or incomplete; product and smoke gates determine platform eligibility.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  compare-linux:
    if: ${{ always() && needs.guard.result == 'success' }}
    needs: [build-linux, guard]
    continue-on-error: true
    outputs:
      gate_state: ${{ steps.finalize.outputs.gate_state }}
    env:
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
      BUILD_RESULT: ${{ needs.build-linux.result }}
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        if: needs.build-linux.result == 'success'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Download Linux build lanes
        id: download-linux-lanes
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tightbeam-linux-build-*
          merge-multiple: false
          path: build/downloads
      - name: Compare reproducible Linux assets
        id: compare_assets
        if: needs.build-linux.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-a build-b build-a/.receipts build-b/.receipts
          for file in \
            surf-ace-server-linux-x86_64-v${PRODUCT_VERSION}.tar.gz \
            surf-ace-cli-linux-x86_64-v${PRODUCT_VERSION}.tar.gz \
            surf-ace-electron-linux-x86_64-v${PRODUCT_VERSION}.zip; do
            for lane in build-a build-b; do
              source="build/downloads/tightbeam-linux-${lane}/${file}"
              test -s "${source}"
              cp "${source}" "${lane}/"
              (cd "${lane}" && shasum -a 256 "${file}") >> "${lane}/.receipts/SHA256SUMS"
            done
          done
          node tooling/scripts/release/compare-release-builds.mjs \
            --build-a build-a \
            --build-b build-b \
            --files surf-ace-server-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,surf-ace-cli-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,surf-ace-electron-linux-x86_64-v${PRODUCT_VERSION}.zip \
            > linux-byte-comparison.json
      - name: Report Linux comparison gate
        id: finalize
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build-linux.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download-linux-lanes.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare_assets.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            gate_state=unavailable
            printf '::warning::Linux assets were not eligible because the Linux build and tests did not complete successfully.\n'
          elif [[ "${DOWNLOAD_OUTCOME}" != "success" ]]; then
            gate_state=unavailable
            printf '::warning::Linux build artifacts were unavailable for the platform comparison; Linux assets were withheld.\n'
          elif [[ "${COMPARE_OUTCOME}" == "success" ]]; then
            gate_state=passed
            printf 'Linux build-lane comparison passed.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            gate_state=failed
            printf '::warning::Linux assets were withheld because their platform comparison did not pass.\n'
          fi
          printf 'gate_state=%s\n' "${gate_state}" >> "$GITHUB_OUTPUT"

  compare-macos:
    if: ${{ always() && needs.guard.result == 'success' }}
    needs: [build-macos, guard]
    continue-on-error: true
    outputs:
      gate_state: ${{ steps.finalize.outputs.gate_state }}
    env:
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
      BUILD_RESULT: ${{ needs.build-macos.result }}
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        if: needs.build-macos.result == 'success'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Download macOS build lanes
        id: download-macos-lanes
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tightbeam-macos-build-*
          merge-multiple: false
          path: build/downloads
      - name: Compare reproducible macOS assets
        id: compare_assets
        if: needs.build-macos.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-a build-b build-a/.receipts build-b/.receipts
          for file in \
            surf-ace-cli-macos-arm64-v${PRODUCT_VERSION}.tar.gz \
            surf-ace-electron-macos-arm64-v${PRODUCT_VERSION}.zip; do
            for lane in build-a build-b; do
              source="build/downloads/tightbeam-macos-${lane}/${file}"
              test -s "${source}"
              cp "${source}" "${lane}/"
              (cd "${lane}" && shasum -a 256 "${file}") >> "${lane}/.receipts/SHA256SUMS"
            done
          done
          node tooling/scripts/release/compare-release-builds.mjs \
            --build-a build-a \
            --build-b build-b \
            --files surf-ace-cli-macos-arm64-v${PRODUCT_VERSION}.tar.gz,surf-ace-electron-macos-arm64-v${PRODUCT_VERSION}.zip \
            > macos-byte-comparison.json
      - name: Report macOS comparison gate
        id: finalize
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build-macos.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download-macos-lanes.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare_assets.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            gate_state=unavailable
            printf '::warning::macOS assets were not eligible because the macOS build and tests did not complete successfully.\n'
          elif [[ "${DOWNLOAD_OUTCOME}" != "success" ]]; then
            gate_state=unavailable
            printf '::warning::macOS build artifacts were unavailable for the platform comparison; macOS assets were withheld.\n'
          elif [[ "${COMPARE_OUTCOME}" == "success" ]]; then
            gate_state=passed
            printf 'macOS build-lane comparison passed.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            gate_state=failed
            printf '::warning::macOS assets were withheld because their platform comparison did not pass.\n'
          fi
          printf 'gate_state=%s\n' "${gate_state}" >> "$GITHUB_OUTPUT"

  compare-six-file-warning:
    if: always()
    needs: [build-linux, build-macos, guard]
    continue-on-error: true
    outputs:
      state: ${{ steps.report.outputs.state }}
    env:
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        if: ${{ needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Download all build lanes
        if: ${{ needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tightbeam-*-build-*
          merge-multiple: false
          path: build/downloads
      - name: Compare all six release assets for information
        id: compare_all
        if: ${{ needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
        env:
          PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
        run: |
          set -euo pipefail
          mkdir -p build-a build-b build-a/.receipts build-b/.receipts
          for file in \
            surf-ace-server-linux-x86_64-v${PRODUCT_VERSION}.tar.gz \
            surf-ace-cli-linux-x86_64-v${PRODUCT_VERSION}.tar.gz \
            surf-ace-electron-linux-x86_64-v${PRODUCT_VERSION}.zip \
            surf-ace-cli-macos-arm64-v${PRODUCT_VERSION}.tar.gz \
            surf-ace-electron-macos-arm64-v${PRODUCT_VERSION}.zip \
            surf-ace-skill-v${PRODUCT_VERSION}.md; do
            for lane in build-a build-b; do
              platform=linux
              if [[ "${file}" == *-macos-* ]]; then platform=macos; fi
              source="build/downloads/tightbeam-${platform}-${lane}/${file}"
              test -s "${source}"
              cp "${source}" "${lane}/"
              (cd "${lane}" && shasum -a 256 "${file}") >> "${lane}/.receipts/SHA256SUMS"
            done
          done
          node tooling/scripts/release/compare-release-builds.mjs \
            --build-a build-a \
            --build-b build-b \
            --files surf-ace-server-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,surf-ace-cli-linux-x86_64-v${PRODUCT_VERSION}.tar.gz,surf-ace-electron-linux-x86_64-v${PRODUCT_VERSION}.zip,surf-ace-cli-macos-arm64-v${PRODUCT_VERSION}.tar.gz,surf-ace-electron-macos-arm64-v${PRODUCT_VERSION}.zip,surf-ace-skill-v${PRODUCT_VERSION}.md \
            > six-file-comparison.json
      - name: Report six-file comparison warning
        id: report
        if: always()
        env:
          BUILD_LINUX_RESULT: ${{ needs.build-linux.result }}
          BUILD_MACOS_RESULT: ${{ needs.build-macos.result }}
          COMPARE_OUTCOME: ${{ steps.compare_all.outcome }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_LINUX_RESULT}" == "success" && "${BUILD_MACOS_RESULT}" == "success" && "${COMPARE_OUTCOME}" == "success" ]]; then
            state=passed
            printf 'The informational six-file comparison matched.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            state=warning
            printf '::warning::The informational six-file comparison was unavailable or differed; platform comparison gates determine asset eligibility.\n'
            printf 'The informational six-file comparison was unavailable or differed; platform comparison gates determine asset eligibility.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'state=%s\n' "${state}" >> "$GITHUB_OUTPUT"

  assemble-linux:
    needs: [compare-linux, guard]
    if: ${{ needs.guard.result == 'success' && needs.compare-linux.outputs.gate_state == 'passed' }}
    continue-on-error: true
    outputs:
      gate_state: ${{ steps.finalize.outputs.gate_state }}
    env:
      PRODUCT_COMMIT: ${{ needs.guard.outputs.product_commit }}
      PRODUCT_VERSION: ${{ needs.guard.outputs.product_version }}
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        id: checkout-tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        id: checkout-source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Download compared Linux build A assets
        id: download-linux-assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tightbeam-linux-build-a
          path: build/release/tightbeam
      - name: Pin Node
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assemble the Linux component manifest and SHA256SUMS
        id: assemble-linux-assets
        env:
          SURF_ACE_RELEASE_COMPONENT: manifest
        run: |
          set -euo pipefail
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          rm -f "build/release/tightbeam/surf-ace-skill-v${PRODUCT_VERSION}.md"
          node tooling/scripts/release/build-tightbeam-release.mjs \
            --source-dir source \
            --output-dir build/release/tightbeam \
            --source-tag "${PRODUCT_TAG}" \
            --source-commit "${PRODUCT_COMMIT}" \
            --version "${PRODUCT_VERSION}" \
            --components linux \
            --target "${LINUX_RUST_TARGET}"
      - name: Retain the Linux smoke candidate
        id: retain-linux-candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tightbeam-linux-candidate
          path: build/release/tightbeam
          if-no-files-found: error
          retention-days: 30
      - name: Report Linux candidate eligibility
        id: finalize
        if: always()
        env:
          TOOLING_OUTCOME: ${{ steps.checkout-tooling.outcome }}
          SOURCE_OUTCOME: ${{ steps.checkout-source.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-linux-assets.outcome }}
          NODE_OUTCOME: ${{ steps.setup-node.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble-linux-assets.outcome }}
          RETAIN_OUTCOME: ${{ steps.retain-linux-candidate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TOOLING_OUTCOME" != success || "$SOURCE_OUTCOME" != success || "$DOWNLOAD_OUTCOME" != success || "$NODE_OUTCOME" != success ]]; then
            gate_state=unavailable
            printf '::warning::Linux candidate assembly could not complete because required inputs or infrastructure were unavailable.\n'
          elif [[ "$ASSEMBLE_OUTCOME" != success ]]; then
            gate_state=failed
            printf '::warning::Linux candidate assembly failed; Linux assets were withheld.\n'
          elif [[ "$RETAIN_OUTCOME" != success ]]; then
            gate_state=unavailable
            printf '::warning::Linux candidate artifact could not be retained; Linux assets were withheld.\n'
          else
            gate_state=passed
          fi
          printf 'gate_state=%s\n' "$gate_state" >> "$GITHUB_OUTPUT"

