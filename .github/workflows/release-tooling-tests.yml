name: Release tooling tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/release/**"
      - ".github/workflows/release-tightbeam.yml"
      - ".github/workflows/release-tooling-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install the pinned Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.3.0
      - name: Install locked workspace dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          test "$(pnpm --version)" = 10.15.1
          pnpm install --frozen-lockfile
      - name: Run release tooling behavior tests
        run: pnpm test:release
