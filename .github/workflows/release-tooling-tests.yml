name: Release tooling tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/release/**"
      - "integrations/tightbeam/skills/surf-ace/SKILL.md"
      - ".github/actions/linux-release-smoke/**"
      - ".github/workflows/release-tightbeam.yml"
      - ".github/workflows/release-tooling-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "packages/cli/**"

permissions:
  contents: read

jobs:
  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install the pinned Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.3.0
      - name: Install locked workspace dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          test "$(pnpm --version)" = 10.15.1
          pnpm install --frozen-lockfile
      - name: Run release tooling behavior tests
        run: pnpm test:release

  package-linux:
    env:
      NODE_VERSION: 24.3.0
      PNPM_VERSION: 10.15.1
      PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha }}
      # Naming inputs for qualification only. No Git refs are created or used.
      PRODUCT_VERSION: "0.2.11"
      PRODUCT_TAG: surf-ace-v0.2.11-r1
      TOOLING_TAG: surf-ace-release-tooling-v0.2.11-r1
    runs-on: ubuntu-24.04
    container:
      image: rust:1.89.0-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tooling at the pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false
      - name: Check out product at the pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false
      - name: Install checksum-pinned Node and pnpm
        run: |
          set -euo pipefail
          curl -fsSLO https://nodejs.org/dist/v24.3.0/node-v24.3.0-linux-x64.tar.xz
          printf '%s  %s\n' a962afadaa8b94bae8bff87ddd6c11f7aae621032424ef05c0a4fe2537fa4de0 node-v24.3.0-linux-x64.tar.xz | sha256sum -c -
          tar -xJf node-v24.3.0-linux-x64.tar.xz -C /usr/local --strip-components=1
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Run the Linux CLI product tests
        run: cargo test --manifest-path source/packages/cli/Cargo.toml --locked
      - name: Build Linux packages for qualification
        env:
          SURF_ACE_RELEASE_COMPONENT: linux
        run: |
          set -euo pipefail
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
          node tooling/scripts/release/build-tightbeam-release.mjs \
            --qualification-only linux \
            --source-dir source \
            --output-dir "$PWD/build/release/tightbeam" \
            --source-commit "$PRODUCT_COMMIT" \
            --tooling-commit "$PRODUCT_COMMIT" \
            --version "$PRODUCT_VERSION" \
            --target x86_64-unknown-linux-gnu
      - name: Retain the Linux qualification packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-qualification-packages
          path: build/release/tightbeam
          if-no-files-found: error

      - name: Read public help from the packaged Linux CLI
        run: |
          set -euo pipefail
          tar -xzf "build/release/tightbeam/surf-ace-cli-linux-x86_64-v${PRODUCT_VERSION}.tar.gz"
          ./surf-ace-cli/bin/surf-ace --help > cli-help.json
      - name: Retain the Linux CLI public help
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-qualification-cli-help
          path: cli-help.json
          if-no-files-found: error

  smoke-linux:
    needs: package-linux
    env:
      NODE_VERSION: 24.3.0
      PNPM_VERSION: 10.15.1
      POSTGRES_VERSION: "16"
      PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha }}
      TOOLING_COMMIT: ${{ github.event.pull_request.head.sha }}
      # Naming inputs for qualification only. No Git refs are created or used.
      PRODUCT_VERSION: "0.2.11"
      PRODUCT_TAG: surf-ace-v0.2.11-r1
      TOOLING_TAG: surf-ace-release-tooling-v0.2.11-r1
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tooling at the pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false
      - name: Check out a fresh product tree at the pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false
      - name: Download the Linux qualification packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-qualification-packages
          path: build/release/tightbeam
      - name: Run packaged Linux fresh-install smoke
        uses: ./tooling/.github/actions/linux-release-smoke
        with:
          qualification-only: 'true'
      - name: Retain Linux smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-qualification-smoke
          path: |
            linux-smoke.json
            linux-smoke-stderr.log
            linux-smoke-failure/


  package-macos:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        lane: [build-a, build-b]
    env:
      PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha }}
      # Naming inputs for qualification only. No Git refs are created or used.
      PRODUCT_TAG: surf-ace-v0.2.11-r1
      TOOLING_TAG: surf-ace-release-tooling-v0.2.11-r1
    steps:
      - name: Check out tooling at the pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false
      - name: Check out product at the pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.3.0
      - name: Build macOS packages without publication
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.0.0.app
          test "$(xcodebuild -version | head -1)" = "Xcode 27.0"
          test "$(git -C tooling rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$PRODUCT_COMMIT"
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          test "$(pnpm --version)" = 10.15.1
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
          rust_version="$(node --input-type=module -e 'import { TOOLCHAINS } from "./tooling/scripts/release/tightbeam-release-config.mjs"; console.log(TOOLCHAINS.rust)')"
          rustup toolchain install "$rust_version" --profile minimal --target aarch64-apple-darwin
          mkdir -p macos-packages
          node --input-type=module <<'NODE'
          import { buildTightbeamMacosPackages } from "./tooling/scripts/release/build-tightbeam-release.mjs";
          import { assertTrackedInputsUnchanged, writeChecksumReceipt } from "./tooling/scripts/release/release-lib.mjs";
          await assertTrackedInputsUnchanged("source");
          const { files, outputDir } = await buildTightbeamMacosPackages({
            sourceDir: "source",
            outputDir: "macos-packages",
            unsigned: true,
          });
          await writeChecksumReceipt(outputDir, files);
          NODE
      - name: Read public help from the packaged macOS CLI
        run: |
          set -euo pipefail
          tar -xzf macos-packages/surf-ace-cli-macos-arm64-v0.2.11.tar.gz
          ./surf-ace-cli/bin/surf-ace --help > macos-packages/.receipts/cli-help.json
      - name: Retain macOS qualification packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-qualification-${{ matrix.lane }}
          path: macos-packages
          include-hidden-files: true
          if-no-files-found: error

  compare-macos:
    needs: [package-macos, package-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tooling at the pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.3.0
      - name: Download both independent macOS builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: macos-qualification-build-*
          path: macos-builds
      - name: Download the packaged Linux CLI public help
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-qualification-cli-help
          path: linux-cli
      - name: Compare public command surfaces from all packaged CLIs
        run: |
          set -euo pipefail
          jq -ceS '.result.commands | select(type == "array" and length > 0) | sort_by(.name)' \
            linux-cli/cli-help.json > linux-commands.json
          for lane in build-a build-b; do
            jq -ceS '.result.commands | select(type == "array" and length > 0) | sort_by(.name)' \
              "macos-builds/macos-qualification-${lane}/.receipts/cli-help.json" > macos-commands.json
            diff -u linux-commands.json macos-commands.json
          done
      - name: Compare macOS packages byte for byte
        run: |
          set -euo pipefail
          node scripts/release/compare-release-builds.mjs \
            --build-a macos-builds/macos-qualification-build-a \
            --build-b macos-builds/macos-qualification-build-b \
            --files surf-ace-cli-macos-arm64-v0.2.11.tar.gz,surf-ace-electron-macos-arm64-v0.2.11.zip \
            | tee macos-byte-comparison.json
      - name: Retain macOS comparison evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-qualification-comparison
          path: macos-byte-comparison.json
          if-no-files-found: error
