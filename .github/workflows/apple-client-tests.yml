name: Apple client tests

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/ios/**"
      - ".github/workflows/apple-client-tests.yml"
      - ".github/workflows/release-tightbeam.yml"

permissions:
  contents: read

jobs:
  registration:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD HEAD^{tree}
          sudo xcode-select --switch /Applications/Xcode_27.0.0.app
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Detect changes to iOS source
        id: ios_source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          changed_files="$(git diff --name-only "$merge_base" "$HEAD_SHA" -- packages/ios/)"
          if [[ -n "$changed_files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Recovery tests will run because this pull request changes iOS source."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Recovery tests are skipped because this pull request does not change iOS source."
          fi
      - name: Test registration and saved-state adoption
        run: |
          xcodebuild test \
            -project packages/ios/SurfAce.xcodeproj \
            -scheme SurfAce \
            -configuration Release \
            ENABLE_TESTABILITY=YES \
            -parallel-testing-enabled NO \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=27.0' \
            -only-testing:SurfAceTests/SurfAceCentralRegistrationTests \
            -only-testing:SurfAceTests/SurfAceLocklessRuntimeAdapterTests/testRegistrationKeepsFinalCloseReleasesPendingUntilExactAcknowledgementsCommit \
            -only-testing:SurfAceTests/SurfAceLocklessRuntimeAdapterTests/testRegistrationAppliesMatchingClaimsAfterLocalSnapshotChangesAndRetriesRemainder \
            -only-testing:SurfAceTests/SurfAceLocklessRuntimeAdapterTests/testRegistrationUsesLabelClaimsWithoutGenerationAndPreservesSavedContent \
            -only-testing:SurfAceTests/SurfAceLocklessRuntimeAdapterTests/testRegistrationPreservesConfirmedLabelsWhenReplyWouldRewriteIdentity \
            -resultBundlePath "$RUNNER_TEMP/apple-registration-tests.xcresult"
      - name: Test lockless authority, reclamation, and mounted pixels
        if: steps.ios_source.outputs.changed == 'true'
        run: |
          xcodebuild test \
            -project packages/ios/SurfAce.xcodeproj \
            -scheme SurfAce \
            -configuration Release \
            ENABLE_TESTABILITY=YES \
            -parallel-testing-enabled NO \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=27.0' \
            -only-testing:SurfAceTests/SurfAceLocklessAuthorityTests \
            -only-testing:SurfAceTests/SurfAceControllerReclamationAccountingTests \
            -only-testing:SurfAceTests/SurfAceLocklessWebSocketIntegrationTests/testContentSetReachesMountedVisiblePixels \
            -resultBundlePath "$RUNNER_TEMP/apple-recovery-tests.xcresult"
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-ios-tests
          path: |
            ${{ runner.temp }}/apple-registration-tests.xcresult
            ${{ runner.temp }}/apple-recovery-tests.xcresult
          if-no-files-found: warn
  tvos:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record source and select tvOS simulator
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree}
          sudo xcode-select --switch /Applications/Xcode_27.0.0.app
          xcodebuild -version
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/tvos-runtimes.json"
          runtime_id="$(python3 - "$RUNNER_TEMP/tvos-runtimes.json" <<'PY'
          import json, sys
          runtimes = [r for r in json.load(open(sys.argv[1]))['runtimes']
                      if r['isAvailable'] and '.tvOS-' in r['identifier']]
          print(max(runtimes, key=lambda r: tuple(map(int, r['version'].split('.'))))['identifier'])
          PY
          )"
          simulator_id="$(xcrun simctl create 'Surf Ace tvOS tests' com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-1080p "$runtime_id")"
          echo "TVOS_SIMULATOR=$simulator_id" >> "$GITHUB_ENV"
      - name: Test native panes and runtime preservation
        run: |
          xcodebuild test \
            -project packages/ios/SurfAceTV.xcodeproj -scheme SurfAceTV \
            -configuration Debug -jobs 2 -parallel-testing-enabled NO \
            -destination "id=$TVOS_SIMULATOR" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            -resultBundlePath "$RUNNER_TEMP/tvos-native-tests.xcresult"
      - name: Test Siri Remote annotation and arrangement
        run: |
          xcodebuild test \
            -project packages/ios/SurfAceTV.xcodeproj -scheme SurfAceTVRemote \
            -configuration Debug -jobs 2 -parallel-testing-enabled NO \
            -destination "id=$TVOS_SIMULATOR" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            -resultBundlePath "$RUNNER_TEMP/tvos-remote-tests.xcresult"
      - name: Preserve tvOS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-tvos-tests
          path: |
            ${{ runner.temp }}/tvos-native-tests.xcresult
            ${{ runner.temp }}/tvos-remote-tests.xcresult
          if-no-files-found: warn
      - name: Remove isolated simulator
        if: always() && env.TVOS_SIMULATOR != ''
        run: |
          xcrun simctl shutdown "$TVOS_SIMULATOR" || true
          xcrun simctl delete "$TVOS_SIMULATOR"
