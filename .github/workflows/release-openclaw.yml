name: Release final OpenClaw-compatible Surf Ace

on:
  push:
    branches:
      - release/run-openclaw-v0.1.0

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: surf-ace-openclaw-v0.1.0
  cancel-in-progress: false

env:
  NODE_VERSION: 24.3.0
  PNPM_VERSION: 10.15.1
  PRODUCT_COMMIT: 58ac8c435679e6611903d31abaecec11bb9d7f75
  PRODUCT_TAG: surf-ace-openclaw-v0.1.0
  TOOLING_TAG: surf-ace-release-tooling-v0.1.0
  TRIGGER_REF: refs/heads/release/run-openclaw-v0.1.0

jobs:
  guard:
    runs-on: macos-15
    steps:
      - name: Require immutable tooling dispatch and product tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          peel_tag() {
            read -r object_type object_sha <<EOF
          $(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1" --jq '.object.type + " " + .object.sha')
          EOF
            while test "${object_type}" = tag; do
              read -r object_type object_sha <<EOF
          $(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.type + " " + .object.sha')
          EOF
            done
            test "${object_type}" = commit
            printf '%s\n' "${object_sha}"
          }
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_REF}" = "${TRIGGER_REF}"
          tooling_remote="$(peel_tag "${TOOLING_TAG}")"
          product_remote="$(peel_tag "${PRODUCT_TAG}")"
          test "${tooling_remote}" = "${GITHUB_SHA}"
          test "${product_remote}" = "${PRODUCT_COMMIT}"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        lane: [build-a, build-b]
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ env.PRODUCT_TAG }}
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pin pnpm and frozen dependency closure
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          test "$(xcodebuild -version | head -1)" = "Xcode 16.4"
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          sha256sum source/pnpm-lock.yaml
          pnpm --dir source fetch --frozen-lockfile
          pnpm --dir source install --offline --frozen-lockfile
      - name: Run exact OpenClaw tests without changing tracked inputs
        run: |
          set -euo pipefail
          guard() {
            git -C source diff --exit-code HEAD -- .
            git -C source diff --cached --exit-code HEAD -- .
          }
          guard
          pnpm --dir source/packages/extension exec sh -c 'node --import tsx --test src/*.test.ts scripts/*.test.mjs'
          guard
          pnpm --dir source --filter @surf-ace/controller test
          guard
          pnpm --dir source --filter @surf-ace/protocol test
          guard
          pnpm --dir source --filter @surf-ace/electron build
          guard
          pnpm --dir source --filter @surf-ace/electron test
          guard
      - name: Build exact release set
        run: |
          set -euo pipefail
          node tooling/scripts/release/build-openclaw-release.mjs \
            --source-dir source \
            --output-dir build/release/openclaw \
            --source-tag "${PRODUCT_TAG}" \
            --source-commit "${PRODUCT_COMMIT}" \
            --version 0.1.0
          git -C source diff --exit-code HEAD -- .
          git -C source diff --cached --exit-code HEAD -- .
      - name: Retain one clean build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openclaw-${{ matrix.lane }}
          path: build/release/openclaw
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Remove job-owned source and generated paths
        if: always()
        run: |
          rm -rf "${GITHUB_WORKSPACE}/source" "${GITHUB_WORKSPACE}/tooling" "${GITHUB_WORKSPACE}/build"

  compare:
    needs: build
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Download build A
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openclaw-build-a
          path: build-a
      - name: Download build B
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openclaw-build-b
          path: build-b
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Compare checksums and every public byte
        run: |
          node tooling/scripts/release/compare-release-builds.mjs \
            --build-a build-a \
            --build-b build-b \
            --files surf-ace-openclaw-electron-macos-arm64-v0.1.0.zip,surf-ace-openclaw-extension-v0.1.0.tgz,surf-ace-openclaw-v0.1.0-manifest.json

  smoke:
    needs: compare
    runs-on: macos-15
    steps:
      - name: Check out immutable tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
          ref: ${{ env.TOOLING_TAG }}
      - name: Check out test-only baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: baseline
          persist-credentials: false
          ref: d889f2f4bfb554bc3bfde0eb9927372552d40e51
      - name: Download compared candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openclaw-build-a
          path: build/release/openclaw
      - name: Pin Node and pnpm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build frozen test-only baseline
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          test "$(xcodebuild -version | head -1)" = "Xcode 16.4"
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --dir baseline fetch --frozen-lockfile
          pnpm --dir baseline install --offline --frozen-lockfile
          node tooling/scripts/release/build-smoke-baseline.mjs \
            --component openclaw \
            --source-dir baseline \
            --output-dir baseline-build \
            --source-commit d889f2f4bfb554bc3bfde0eb9927372552d40e51
      - name: Smoke clean install, upgrade, and rollback
        env:
          SURF_ACE_OPENCLAW_BASELINE_ELECTRON: ${{ github.workspace }}/baseline-build/baseline-electron.zip
          SURF_ACE_OPENCLAW_BASELINE_EXTENSION: ${{ github.workspace }}/baseline-build/baseline-extension.tgz
        run: |
          set -euo pipefail
          node tooling/scripts/release/smoke-openclaw-release.mjs \
            --baseline-commit d889f2f4bfb554bc3bfde0eb9927372552d40e51 \
            --candidate-commit 58ac8c435679e6611903d31abaecec11bb9d7f75 \
            --openclaw-version 2026.7.1-2 \
            --manifest build/release/openclaw/surf-ace-openclaw-v0.1.0-manifest.json \
            --extension build/release/openclaw/surf-ace-openclaw-extension-v0.1.0.tgz \
            --electron build/release/openclaw/surf-ace-openclaw-electron-macos-arm64-v0.1.0.zip
          node tooling/scripts/release/write-smoke-receipt.mjs \
            --channel openclaw \
            --manifest build/release/openclaw/surf-ace-openclaw-v0.1.0-manifest.json \
            --files build/release/openclaw/surf-ace-openclaw-extension-v0.1.0.tgz,build/release/openclaw/surf-ace-openclaw-electron-macos-arm64-v0.1.0.zip \
            --output build/release/openclaw/.receipts/smoke-receipt.json
      - name: Retain smoke-approved bytes and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openclaw-smoke-approved
          path: build/release/openclaw
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  attest-and-publish:
    needs: smoke
    environment: openclaw-release
    runs-on: macos-15
    steps:
      - name: Download unchanged smoke-approved files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openclaw-smoke-approved
          path: release
      - name: Attest immutable smoke receipt
        id: attest
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: release/.receipts/smoke-receipt.json
      - name: Publish only attested smoke-approved files
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -n "${ATTESTATION_URL}"
          gh release create "${PRODUCT_TAG}" \
            release/surf-ace-openclaw-extension-v0.1.0.tgz \
            release/surf-ace-openclaw-electron-macos-arm64-v0.1.0.zip \
            release/surf-ace-openclaw-v0.1.0-manifest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Surf Ace OpenClaw v0.1.0" \
            --notes "Smoke attestation: ${ATTESTATION_URL}"
