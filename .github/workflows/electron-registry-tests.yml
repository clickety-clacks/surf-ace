name: Electron registry tests

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/electron/**"
      - ".github/workflows/electron-registry-tests.yml"

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Record source and runtime
        run: |
          git rev-parse HEAD HEAD^{tree}
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @surf-ace/protocol build
      - run: pnpm --filter @surf-ace/electron build
      - name: Test binding, persistence, claims and release recovery
        run: |
          node --test \
            packages/electron/dist/test/identity.test.js \
            packages/electron/dist/test/lockless-client-authority.test.js \
            packages/electron/dist/test/persistent-state-file.test.js \
            packages/electron/dist/test/surface-core.test.js \
            packages/electron/dist/test/server-connection.test.js
